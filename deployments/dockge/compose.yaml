name: ${COMPOSE_PROJECT_NAME:-scheduler-pro}

x-api-env: &api-env
  DB_SERVICE_NAME: ${DB_SERVICE_NAME:-scheduler-api}
  DB_PLATFORM_POOL_SIZE: ${DB_PLATFORM_POOL_SIZE:-4}
  DB_PLATFORM_MAX_OVERFLOW: ${DB_PLATFORM_MAX_OVERFLOW:-2}
  DB_TENANT_POOL_SIZE: ${DB_TENANT_POOL_SIZE:-1}
  DB_TENANT_MAX_OVERFLOW: ${DB_TENANT_MAX_OVERFLOW:-1}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-3}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-600}
  DB_CONNECTION_BUDGET_PER_PROCESS: ${DB_CONNECTION_BUDGET_PER_PROCESS:-24}
  TENANT_ENGINE_CACHE_MAX: ${TENANT_ENGINE_CACHE_MAX:-8}
  TENANT_ENGINE_CACHE_TTL_SECONDS: ${TENANT_ENGINE_CACHE_TTL_SECONDS:-120}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-0}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-0}
  DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-0}
  HEALTH_PROBE_TIMEOUT_SECONDS: ${HEALTH_PROBE_TIMEOUT_SECONDS:-3}
  HEALTH_CACHE_SECONDS: ${HEALTH_CACHE_SECONDS:-5}
  DB_CAPACITY_WARNING_PERCENT: ${DB_CAPACITY_WARNING_PERCENT:-75}
  DB_CAPACITY_CRITICAL_PERCENT: ${DB_CAPACITY_CRITICAL_PERCENT:-90}
  HTTP_LOG_MAX_PENDING: ${HTTP_LOG_MAX_PENDING:-64}
  HTTP_LOG_CONCURRENCY: ${HTTP_LOG_CONCURRENCY:-2}
  HTTP_LOG_TIMEOUT_SECONDS: ${HTTP_LOG_TIMEOUT_SECONDS:-3}
  API_MAX_INFLIGHT_REQUESTS: ${API_MAX_INFLIGHT_REQUESTS:-64}
  APP_NAME: ${APP_NAME:-Scheduler Pro}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY obrigatória}
  PUBLIC_PLATFORM_DOMAIN: ${PUBLIC_PLATFORM_DOMAIN:?PUBLIC_PLATFORM_DOMAIN obrigatório}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${PUBLIC_PLATFORM_DOMAIN}}
  ADMIN_PLATFORM_DOMAINS: ${ADMIN_PLATFORM_DOMAINS:-admin.scheduler.argws.com.br,api.scheduler.argws.com.br}
  TENANT_DEFAULT_DOMAIN_ROOT: ${TENANT_DEFAULT_DOMAIN_ROOT:-scheduler.argws.com.br}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL obrigatório}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD obrigatória}
  POSTGRES_HOST: scheduler-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-platform}
  POSTGRES_USER: ${POSTGRES_USER:-scheduler}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
  POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
  POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD obrigatória}
  REDIS_URL: redis://scheduler-redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-scheduler}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@scheduler-rabbitmq:5672//
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-scheduler}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@scheduler-rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://scheduler-redis:6379/1
  S3_ENDPOINT: http://scheduler-minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY obrigatória}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY obrigatória}
  S3_REGION: ${S3_REGION:-sa-east-1}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-scheduler-public}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS obrigatória}
  CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  CLOUDFLARE_DRY_RUN: ${CLOUDFLARE_DRY_RUN:-false}
  CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN: ${CLOUDFLARE_CUSTOM_HOSTNAME_ORIGIN:-proxy.scheduler.argws.com.br}
  CLOUDFLARE_TEMPORARY_RECORD_TYPE: ${CLOUDFLARE_TEMPORARY_RECORD_TYPE:-CNAME}
  CLOUDFLARE_TEMPORARY_RECORD_TARGET: ${CLOUDFLARE_TEMPORARY_RECORD_TARGET:-proxy.scheduler.argws.com.br}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
  EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
  EVOLUTION_API_TOKEN: ${EVOLUTION_API_TOKEN:-}
  EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-scheduler-pro}
  GITHUB_ACTIONS_API_BASE_URL: ${GITHUB_ACTIONS_API_BASE_URL:-https://api.github.com}
  GITHUB_ACTIONS_REPOSITORY: ${GITHUB_ACTIONS_REPOSITORY:-wkarts/scheduler-pro-platform}
  GITHUB_ACTIONS_TOKEN: ${GITHUB_ACTIONS_TOKEN:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  scheduler-storage-init:
    image: ${STORAGE_INIT_IMAGE:-alpine:3.22}
    restart: "no"
    user: "0:0"
    volumes: ["${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}:/data"]
    command: ["/bin/sh", "-ec", "mkdir -p /data/postgres /data/redis /data/rabbitmq /data/minio /data/app /data/backups /data/celery && chmod 0777 /data/postgres /data/redis /data/rabbitmq /data/minio /data/celery"]
    logging: *logging

  scheduler-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    depends_on: {scheduler-storage-init: {condition: service_completed_successfully}}
    environment: {POSTGRES_DB: '${POSTGRES_DB:-platform}', POSTGRES_USER: '${POSTGRES_USER:-scheduler}', POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}', TZ: '${APP_TIMEZONE:-America/Bahia}'}
    volumes: ["${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""], interval: 10s, timeout: 5s, retries: 20, start_period: 20s}
    logging: *logging

  scheduler-redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: ["${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 20}
    logging: *logging

  scheduler-rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    restart: unless-stopped
    environment: {RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-scheduler}', RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}', TZ: '${APP_TIMEZONE:-America/Bahia}'}
    volumes: ["${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/rabbitmq:/var/lib/rabbitmq"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 15s, timeout: 10s, retries: 20, start_period: 30s}
    logging: *logging

  scheduler-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: '${S3_ACCESS_KEY:?S3_ACCESS_KEY obrigatória}', MINIO_ROOT_PASSWORD: '${S3_SECRET_KEY:?S3_SECRET_KEY obrigatória}', MINIO_REGION_NAME: '${S3_REGION:-sa-east-1}'}
    volumes: ["${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/minio:/data"]
    healthcheck: {test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"], interval: 15s, timeout: 5s, retries: 20, start_period: 20s}
    logging: *logging

  scheduler-migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/api:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    depends_on: {scheduler-postgres: {condition: service_healthy}}
    environment: *api-env
    command: ["python", "-m", "app.cli", "migrate-platform"]
    logging: *logging

  scheduler-platform-bootstrap:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/api:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    depends_on: {scheduler-migrate: {condition: service_completed_successfully}}
    environment: *api-env
    command: ["python", "-m", "app.platform_bootstrap"]
    logging: *logging

  scheduler-api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/api:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      scheduler-platform-bootstrap: {condition: service_completed_successfully}
      scheduler-redis: {condition: service_healthy}
      scheduler-rabbitmq: {condition: service_healthy}
      scheduler-minio: {condition: service_healthy}
    environment: *api-env
    healthcheck: {test: ["CMD-SHELL", "curl --fail --silent -H 'Host: ${PUBLIC_PLATFORM_DOMAIN}' http://127.0.0.1:8000/api/v1/health/ready >/dev/null || exit 1"], interval: 20s, timeout: 10s, retries: 20, start_period: 20s}
    logging: *logging
    security_opt: ["no-new-privileges:true"]

  scheduler-worker-default:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/worker:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on: {scheduler-api: {condition: service_healthy}}
    environment:
      <<: *api-env
      DB_SERVICE_NAME: scheduler-worker-default
      DB_PLATFORM_POOL_SIZE: ${DB_WORKER_PLATFORM_POOL_SIZE:-1}
      DB_PLATFORM_MAX_OVERFLOW: ${DB_WORKER_PLATFORM_MAX_OVERFLOW:-0}
      DB_TENANT_POOL_SIZE: ${DB_WORKER_TENANT_POOL_SIZE:-1}
      DB_TENANT_MAX_OVERFLOW: ${DB_WORKER_TENANT_MAX_OVERFLOW:-0}
      TENANT_ENGINE_CACHE_MAX: ${DB_WORKER_TENANT_ENGINE_CACHE_MAX:-4}
      DB_CONNECTION_BUDGET_PER_PROCESS: ${DB_WORKER_CONNECTION_BUDGET_PER_PROCESS:-8}
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "default,provisioning,domains,builds,maintenance", "--loglevel=INFO", "--concurrency=${CELERY_DEFAULT_CONCURRENCY:-2}", "--max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-500}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    logging: *logging
    security_opt: ["no-new-privileges:true"]

  scheduler-worker-whatsapp:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/worker:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on: {scheduler-api: {condition: service_healthy}}
    environment:
      <<: *api-env
      DB_SERVICE_NAME: scheduler-worker-whatsapp
      DB_PLATFORM_POOL_SIZE: ${DB_WORKER_PLATFORM_POOL_SIZE:-1}
      DB_PLATFORM_MAX_OVERFLOW: ${DB_WORKER_PLATFORM_MAX_OVERFLOW:-0}
      DB_TENANT_POOL_SIZE: ${DB_WORKER_TENANT_POOL_SIZE:-1}
      DB_TENANT_MAX_OVERFLOW: ${DB_WORKER_TENANT_MAX_OVERFLOW:-0}
      TENANT_ENGINE_CACHE_MAX: ${DB_WORKER_TENANT_ENGINE_CACHE_MAX:-4}
      DB_CONNECTION_BUDGET_PER_PROCESS: ${DB_WORKER_CONNECTION_BUDGET_PER_PROCESS:-8}
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "whatsapp,notifications,webhooks", "--loglevel=INFO", "--concurrency=${CELERY_WHATSAPP_CONCURRENCY:-2}", "--max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-500}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    logging: *logging
    security_opt: ["no-new-privileges:true"]

  scheduler-beat:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/worker:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on: {scheduler-api: {condition: service_healthy}}
    environment:
      <<: *api-env
      DB_SERVICE_NAME: scheduler-beat
      DB_PLATFORM_POOL_SIZE: ${DB_WORKER_PLATFORM_POOL_SIZE:-1}
      DB_PLATFORM_MAX_OVERFLOW: ${DB_WORKER_PLATFORM_MAX_OVERFLOW:-0}
      DB_TENANT_POOL_SIZE: ${DB_WORKER_TENANT_POOL_SIZE:-1}
      DB_TENANT_MAX_OVERFLOW: ${DB_WORKER_TENANT_MAX_OVERFLOW:-0}
      TENANT_ENGINE_CACHE_MAX: ${DB_WORKER_TENANT_ENGINE_CACHE_MAX:-4}
      DB_CONNECTION_BUDGET_PER_PROCESS: ${DB_WORKER_CONNECTION_BUDGET_PER_PROCESS:-8}
    volumes: ["${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/celery:/var/lib/celery"]
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule"]
    logging: *logging
    security_opt: ["no-new-privileges:true"]

  scheduler-web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/web:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging

  scheduler-admin:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/admin:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging

  scheduler-proxy:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/proxy:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on: {scheduler-api: {condition: service_healthy}, scheduler-web: {condition: service_started}, scheduler-admin: {condition: service_started}}
    ports: ["${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-18080}:80"]
    logging: *logging
    security_opt: ["no-new-privileges:true"]
