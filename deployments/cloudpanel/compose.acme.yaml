# Compatibilidade para deployments que usam compose.yaml genérico.
# O compose.argws.yaml já inclui scheduler-acme por padrão.
#
# Uso opcional com o compose genérico:
#   docker compose -f compose.yaml -f compose.acme.yaml --profile ssl up -d scheduler-acme

services:
  scheduler-acme:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts/scheduler-pro-platform}/acme:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    profiles:
      - ssl
    environment:
      CF_Token: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN obrigatória para DNS-01}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL obrigatória}
      ACME_DOMAIN: ${ACME_DOMAIN:-scheduler.argws.com.br}
      ACME_STAGING: ${ACME_STAGING:-false}
      ACME_DNS_SLEEP: ${ACME_DNS_SLEEP:-20}
      ACME_CHECK_INTERVAL_SECONDS: ${ACME_CHECK_INTERVAL_SECONDS:-43200}
    volumes:
      - ${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/acme:/acme.sh
      - ${SCHEDULER_PRO_DATA_ROOT:-./scheduler-pro-data}/certs:/certs
