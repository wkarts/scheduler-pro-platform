# Scheduler Pro — referência do estado final do VHost CloudPanel
#
# SUA ÚNICA AÇÃO MANUAL é criar o Reverse Proxy scheduler.argws.com.br ->
# http://127.0.0.1:18080 no CloudPanel.
#
# Você NÃO precisa colar este arquivo. O scheduler-cloudpanel-agent localiza o
# VHost criado pelo CloudPanel e adiciona automaticamente *.scheduler.argws.com.br
# ao server_name, com backup, nginx -t e rollback em caso de erro.
#
# O certificado scheduler.argws.com.br + *.scheduler.argws.com.br também é
# instalado/renovado automaticamente pelo agente via clpctl.
#
# Este arquivo existe apenas como referência auditável do resultado desejado.

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  http3 off;

  {{ssl_certificate_key}}
  {{ssl_certificate}}

  server_name scheduler.argws.com.br *.scheduler.argws.com.br;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  location @reverse_proxy {
    proxy_pass {{reverse_proxy_url}};
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;

    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
  }

  {{settings}}
  include /etc/nginx/global_settings;
  add_header Cache-Control no-transform;
  index index.html;

  location ^~ /.well-known {
    auth_basic off;
    allow all;
    try_files $uri @reverse_proxy;
  }

  location / {
    try_files $uri @reverse_proxy;
  }
}
