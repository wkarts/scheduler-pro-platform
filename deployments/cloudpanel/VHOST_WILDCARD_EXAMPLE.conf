# Scheduler Pro — VHost coringa CloudPanel
#
# Configure o site Reverse Proxy scheduler.argws.com.br para apontar para:
#   http://127.0.0.1:18080
#
# O certificado instalado no site precisa cobrir somente:
#   scheduler.argws.com.br
#   *.scheduler.argws.com.br
#
# Não crie um server{} por tenant. O header Host é preservado e o Scheduler Pro
# resolve o tenant no backend.

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  http3 off;

  {{ssl_certificate_key}}
  {{ssl_certificate}}

  server_name scheduler.argws.com.br *.scheduler.argws.com.br;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  location @reverse_proxy {
    proxy_pass {{reverse_proxy_url}};
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;

    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
  }

  {{settings}}
  include /etc/nginx/global_settings;
  add_header Cache-Control no-transform;
  index index.html;

  location ^~ /.well-known {
    auth_basic off;
    allow all;
    try_files $uri @reverse_proxy;
  }

  location / {
    try_files $uri @reverse_proxy;
  }
}
