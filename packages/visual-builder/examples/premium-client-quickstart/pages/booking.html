<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar</title><link rel="stylesheet" href="../assets/styles.css"></head><body class="booking-page"><main class="shell"><div class="brand"><img data-sp-bind="brand.logo" src="../assets/logo.svg" alt=""><strong data-sp-bind="business.name">Empresa Premium</strong></div><section class="booking-card"><p class="eyebrow">Agenda Pública</p><h1>Escolha o melhor horário</h1><p>Este exemplo usa o motor real do host através do Template Runtime SDK.</p><h3>1. Serviço</h3><div id="services" class="service-grid"><span>Carregando serviços…</span></div><h3>2. Data</h3><label class="field">Data<input id="date" type="date"></label><h3>3. Horário</h3><div id="slots" class="slot-grid"><span>Escolha serviço e data.</span></div><h3>4. Seus dados</h3><label class="field">Nome<input id="name" autocomplete="name"></label><label class="field">Telefone<input id="phone" inputmode="tel"></label><div class="actions"><button id="submit" class="btn primary" type="button">Confirmar agendamento</button><a class="btn" href="/pagina">Voltar</a></div><div id="status" class="status">Aguardando seleção.</div></section></main><script>(async()=>{const runtime=globalThis.ARGWSRuntime,servicesRoot=document.getElementById('services'),slotsRoot=document.getElementById('slots'),status=document.getElementById('status'),date=document.getElementById('date');if(!runtime){status.textContent='Runtime SDK indisponível.';return}let service=null,slot=null;const catalog=await runtime.booking.catalog();const services=Array.isArray(catalog)?catalog:(catalog?.services||[]);servicesRoot.innerHTML=services.map(s=>`<button type="button" class="choice" data-service="${s.id}">${s.name||s.title||'Serviço'}</button>`).join('')||'<span>Nenhum serviço disponível.</span>';servicesRoot.addEventListener('click',async e=>{const btn=e.target.closest('[data-service]');if(!btn)return;service=btn.dataset.service;servicesRoot.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===btn));await runtime.analytics.track('service_selected',{service_id:service});await loadSlots()});date.addEventListener('change',loadSlots);async function loadSlots(){slot=null;if(!service||!date.value)return;slotsRoot.textContent='Buscando horários…';const rows=await runtime.booking.availability({service_id:service,date:date.value});const slots=Array.isArray(rows)?rows:(rows?.slots||rows?.availability||[]);slotsRoot.innerHTML=slots.map(s=>{const value=s.starts_at||s.start||s.value;const label=s.label||new Date(value).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return `<button type="button" class="choice" data-slot="${value}">${label}</button>`}).join('')||'<span>Sem horários disponíveis.</span>'}slotsRoot.addEventListener('click',e=>{const btn=e.target.closest('[data-slot]');if(!btn)return;slot=btn.dataset.slot;slotsRoot.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===btn));runtime.analytics.track('slot_selected',{starts_at:slot})});document.getElementById('submit').addEventListener('click',async()=>{if(!service||!slot){status.textContent='Selecione serviço, data e horário.';return}status.textContent='Confirmando…';try{const appointment=await runtime.booking.create({service_id:service,starts_at:slot,customer:{name:document.getElementById('name').value,phone:document.getElementById('phone').value}});status.textContent='Agendamento confirmado.';await runtime.analytics.track('booking_completed',{appointment_id:appointment?.id||''})}catch(error){status.textContent=error?.message||'Não foi possível concluir.';await runtime.analytics.track('booking_failed',{})}})})()</script></body></html>
