<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar</title><style>body{font-family:Inter,sans-serif;margin:0;padding:32px;background:#f8fafc;color:#0f172a}main{max-width:760px;margin:auto;background:white;padding:28px;border-radius:20px}</style></head><body><main><h1>Agende seu horário</h1><div id="services">Carregando serviços…</div><a href="/pagina">Voltar para o site</a></main><script>(async()=>{const root=document.getElementById('services');if(!globalThis.ARGWSRuntime){root.textContent='Runtime indisponível.';return}const rows=await ARGWSRuntime.booking.catalog();root.innerHTML=rows.map(x=>`<button data-id="${x.id}">${x.name||x.title||'Serviço'}</button>`).join('')})()</script></body></html>
