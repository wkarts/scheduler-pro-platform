<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo</title><style>body{font-family:Inter,sans-serif;margin:0;background:#fff;color:#0f172a}.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}.btn{display:inline-block;padding:14px 22px;border-radius:999px;background:#2563eb;color:white;text-decoration:none}</style></head><body><main class="hero"><div><p data-sp-bind="business.name">Minha empresa</p><h1 data-sp-bind="hero.title">Uma experiência premium</h1><a class="btn" data-sp-show="show_booking" data-sp-action="booking" href="/agendar">Agendar agora</a></div></main><script>document.querySelector('[data-sp-action="booking"]')?.addEventListener('click',e=>{if(globalThis.ARGWSRuntime){e.preventDefault();ARGWSRuntime.navigation.openBooking()}})</script></body></html>
