name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Leave empty to generate v0.1.0-alpha.<run_number>'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
  NODE_VERSION: '24'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Publish release and web/deploy artifacts
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Resolve release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then TAG="${INPUT_TAG}"; else TAG="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "SCHEDULER_PRO_RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Install JS dependencies
        run: npm install
      - name: Build web/admin PWAs
        run: |
          npm --workspace apps/web run build
          npm --workspace apps/admin run build
      - name: Pack web/admin/deploy/source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C apps/web/dist -czf "artifacts/scheduler-pro-web-${SCHEDULER_PRO_RELEASE_TAG}.tar.gz" .
          tar -C apps/admin/dist -czf "artifacts/scheduler-pro-admin-${SCHEDULER_PRO_RELEASE_TAG}.tar.gz" .
          tar -C deployments/cloudpanel -czf "artifacts/scheduler-pro-cloudpanel-${SCHEDULER_PRO_RELEASE_TAG}.tar.gz" .
          tar -C deployments/dockge -czf "artifacts/scheduler-pro-dockge-${SCHEDULER_PRO_RELEASE_TAG}.tar.gz" .
          git archive --format=tar.gz --output="artifacts/scheduler-pro-source-${SCHEDULER_PRO_RELEASE_TAG}.tar.gz" HEAD
          cat > artifacts/distribution-manifest.json <<JSON
          {"name":"Scheduler Pro","tag":"${SCHEDULER_PRO_RELEASE_TAG}","commit":"${GITHUB_SHA}","origin_port":18080,"domains":{"platform":"scheduler.argws.com.br","admin":"admin.scheduler.argws.com.br","api":"api.scheduler.argws.com.br","tenant_pattern":"<codigo-curto>.scheduler.argws.com.br"},"images":{"api":"${IMAGE_NAMESPACE}/api:latest","worker":"${IMAGE_NAMESPACE}/worker:latest","web":"${IMAGE_NAMESPACE}/web:latest","admin":"${IMAGE_NAMESPACE}/admin:latest","proxy":"${IMAGE_NAMESPACE}/proxy:latest"}}
          JSON
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${SCHEDULER_PRO_RELEASE_TAG}"
          NOTES='Release controlada do Scheduler Pro. Android publica APK debug ARM64 assinado para instalação direta em homologação. Desktop publica instaladores Windows MSI/NSIS, Linux DEB e macOS DMG. iOS publica IPA ARM64 não assinado; para instalar em aparelho físico é necessário assinar com identidade/provisionamento Apple.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "Scheduler Pro ${TAG}" --notes "$NOTES" --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-release-${{ steps.version.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error

  desktop-installers:
    name: Desktop installer ${{ matrix.app_name }} / ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux, app_path: apps/desktop, app_name: client, bundles: deb }
          - { os: windows-latest, label: windows, app_path: apps/desktop, app_name: client, bundles: 'msi,nsis' }
          - { os: macos-15, label: macos, app_path: apps/desktop, app_name: client, bundles: dmg }
          - { os: ubuntu-24.04, label: linux, app_path: apps/admin-desktop, app_name: admin, bundles: deb }
          - { os: windows-latest, label: windows, app_path: apps/admin-desktop, app_name: admin, bundles: 'msi,nsis' }
          - { os: macos-15, label: macos, app_path: apps/admin-desktop, app_name: admin, bundles: dmg }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri dependencies
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps
        run: npm install
      - name: Generate official Tauri desktop icons
        run: npx tauri icon packages/branding/scheduler-pro/brand-symbol.svg --output ${{ matrix.app_path }}/src-tauri/icons
      - name: Build installable desktop app
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Collect installers only
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-release.outputs.tag }}"
          mkdir -p artifacts desktop-installers
          find "${{ matrix.app_path }}/src-tauri/target/release/bundle" -type f \( -name '*.msi' -o -name '*setup*.exe' -o -name '*Setup*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -print0 | while IFS= read -r -d '' file; do cp "$file" desktop-installers/; done
          if [ -z "$(find desktop-installers -type f -print -quit)" ]; then
            echo "Nenhum instalador final foi gerado." >&2
            find "${{ matrix.app_path }}/src-tauri/target/release" -maxdepth 5 -type f | sed -n '1,160p'
            exit 1
          fi
          tar -C desktop-installers -czf "artifacts/scheduler-pro-${{ matrix.app_name }}-desktop-${{ matrix.label }}-${TAG}.tar.gz" .
          (cd artifacts && sha256sum * > "scheduler-pro-${{ matrix.app_name }}-desktop-${{ matrix.label }}-${TAG}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-${{ matrix.app_name }}-desktop-${{ matrix.label }}-${{ needs.prepare-release.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error
      - name: Attach desktop artifact to release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" artifacts/* --clobber

  android-debug-apks:
    name: Android debug installable ${{ matrix.app_name }}
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app_path: apps/mobile, app_name: client }
          - { app_path: apps/admin-mobile, app_name: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=${sdk_root}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install JS deps
        run: npm install
      - name: Generate official Tauri mobile icons
        run: npx tauri icon packages/branding/scheduler-pro/brand-symbol.svg --output ${{ matrix.app_path }}/src-tauri/icons
      - name: Initialize Android project
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri:android:init || true
      - name: Build debug signed APK for direct install
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri:android:apk:debug
      - name: Collect installable debug APK only
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-release.outputs.tag }}"
          mkdir -p artifacts
          apk="$(find "${{ matrix.app_path }}/src-tauri" -type f -name '*debug*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "artifacts/scheduler-pro-${{ matrix.app_name }}-android-${TAG}-debug-installable.apk"
          cat > "artifacts/scheduler-pro-${{ matrix.app_name }}-android-${TAG}-README.txt" <<TXT
          APK debug ARM64 assinado automaticamente pelo Gradle/Tauri para instalação direta.
          Instale com: adb install -r scheduler-pro-${{ matrix.app_name }}-android-${TAG}-debug-installable.apk
          TXT
          (cd artifacts && sha256sum * > "scheduler-pro-${{ matrix.app_name }}-android-${TAG}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-${{ matrix.app_name }}-android-debug-installable-${{ needs.prepare-release.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
      - name: Attach Android debug APK to release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" artifacts/* --clobber

  ios-unsigned-ipas:
    name: iOS unsigned IPA ${{ matrix.app_name }}
    needs: prepare-release
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app_path: apps/mobile, app_name: client }
          - { app_path: apps/admin-mobile, app_name: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - name: Install JS deps
        run: npm install
      - name: Validate Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
      - name: Generate official Tauri mobile icons
        run: npx tauri icon packages/branding/scheduler-pro/brand-symbol.svg --output ${{ matrix.app_path }}/src-tauri/icons
      - name: Build real unsigned iOS ARM64 application bundle
        shell: bash
        run: bash scripts/mobile/build-ios-unsigned.sh "${{ matrix.app_path }}" "release/${{ matrix.app_name }}-ios-app" "${{ matrix.app_name }}"
      - name: Package and validate real unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-release.outputs.tag }}"
          app_path="$(cat release/${{ matrix.app_name }}-ios-app/app-path.txt)"
          mkdir -p artifacts
          bash scripts/release/package-ios-unsigned.sh \
            "$app_path" \
            "artifacts/scheduler-pro-${{ matrix.app_name }}-ios-arm64-${TAG}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-${{ matrix.app_name }}-ios-arm64-unsigned-${{ needs.prepare-release.outputs.tag }}
          path: |
            artifacts/*.ipa
            artifacts/*.ipa.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Attach unsigned iOS IPA to release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        shell: bash
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" artifacts/* --clobber
