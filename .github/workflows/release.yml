name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository }}/api:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
