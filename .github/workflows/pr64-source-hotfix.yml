name: PR64 one-shot source hotfix

on:
  push:
    branches:
      - feat/avb-2-3-complete-pages-pwa-navigation

permissions:
  contents: write

jobs:
  patch-web-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical WhatsApp polling condition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/TenantConsole.vue")
          source = path.read_text(encoding="utf-8")
          old = "  whatsappPoll = window.setInterval(() => { if (logged.value && view.value === 'whatsapp' && whatsappStatus.value !== 'CONNECTED') void loadWhatsAppStatus().catch(() => undefined) }, 5000)"
          new = """  whatsappPoll = window.setInterval(() => {
            if (logged.value && hasCapability('whatsapp') && whatsappStatus.value !== 'CONNECTED') {
              void loadWhatsAppStatus().catch(() => undefined)
            }
          }, 5000)"""
          if old not in source:
              raise SystemExit("Expected TenantConsole WhatsApp polling expression was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/pr64-source-hotfix.yml
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): align WhatsApp polling with canonical navigation"
          git push origin HEAD:feat/avb-2-3-complete-pages-pwa-navigation
