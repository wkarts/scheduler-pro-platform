name: Canonical Merge Release
run-name: Canonical PR #${{ github.event.pull_request.number }} / ${{ github.event.pull_request.merge_commit_sha }}

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: canonical-release
  cancel-in-progress: false

jobs:
  publish-canonical:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure canonical version labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create 'version:patch' --repo "$GITHUB_REPOSITORY" --color '0E8A16' --description 'Próxima release incrementa PATCH' --force
          gh label create 'version:minor' --repo "$GITHUB_REPOSITORY" --color '1D76DB' --description 'Próxima release incrementa MINOR' --force
          gh label create 'version:major' --repo "$GITHUB_REPOSITORY" --color 'B60205' --description 'Próxima release incrementa MAJOR' --force

      - name: Resolve and persist next canonical SemVer
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Merge SHA inválido: ${MERGE_SHA}" >&2
            exit 2
          fi

          git fetch origin main --tags --force
          git reset --hard origin/main

          existing_commit="$(
            git log origin/main \
              --grep="Scheduler-Pro-Source-Merge: ${MERGE_SHA}" \
              --format='%H' -n 1 || true
          )"

          if [ -n "$existing_commit" ]; then
            tag="$(git show "${existing_commit}:VERSION" | tr -d '[:space:]')"
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Commit de retry possui VERSION inválido: ${tag}" >&2
              exit 3
            fi
            release_sha="$existing_commit"
            bump="retry"
            echo "Reutilizando versão ${tag} do commit ${release_sha}."
          else
            base_version="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "VERSION inválido: ${base_version}" >&2
              exit 4
            fi

            latest_stable="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
                | sed 's/^v//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 || true
            )"

            if [ -z "$latest_stable" ]; then
              tag="$base_version"
              bump="initial"
            else
              IFS='.' read -r major minor patch <<< "$latest_stable"
              labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' || true)"

              requested=()
              if grep -Eqx 'version:major|semver:major' <<< "$labels"; then requested+=(major); fi
              if grep -Eqx 'version:minor|semver:minor' <<< "$labels"; then requested+=(minor); fi
              if grep -Eqx 'version:patch|semver:patch' <<< "$labels"; then requested+=(patch); fi
              if [ "${#requested[@]}" -gt 1 ]; then
                echo "Use apenas um label de versão: version:patch, version:minor ou version:major." >&2
                exit 5
              fi

              if [ "${#requested[@]}" -eq 1 ]; then
                bump="${requested[0]}"
              elif grep -Eiq '(^|[^A-Za-z])BREAKING CHANGE[ :]+' <<< "$PR_BODY" || grep -Eq '^feat(\([^)]*\))?!:' <<< "$PR_TITLE"; then
                bump="major"
              elif grep -Eq '^feat(\([^)]*\))?:' <<< "$PR_TITLE"; then
                bump="minor"
              else
                bump="patch"
              fi

              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
                *) echo "Bump inválido: $bump" >&2; exit 6 ;;
              esac
              tag="${major}.${minor}.${patch}"
            fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release ${tag} já existe; recusando sobrescrita." >&2
              exit 7
            fi

            python scripts/release/sync-product-version.py "$tag" \
              --source-merge-sha "$MERGE_SHA" \
              --pr-number "$PR_NUMBER" \
              --bump "$bump"

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              VERSION RELEASE-MANIFEST.json package.json package-lock.json \
              apps/web/package.json apps/admin/package.json \
              apps/desktop/package.json apps/mobile/package.json \
              apps/admin-desktop/package.json apps/admin-mobile/package.json \
              apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json \
              apps/mobile/src-tauri/Cargo.toml apps/mobile/src-tauri/tauri.conf.json \
              apps/admin-desktop/src-tauri/Cargo.toml apps/admin-desktop/src-tauri/tauri.conf.json \
              apps/admin-mobile/src-tauri/Cargo.toml apps/admin-mobile/src-tauri/tauri.conf.json \
              packages/api-client/package.json packages/types/package.json \
              infrastructure/docker/api/Dockerfile infrastructure/docker/worker/Dockerfile \
              apps/api/app/api/v1/routes/health.py

            git commit -m "chore(release): ${tag}" \
              -m "Scheduler-Pro-Source-Merge: ${MERGE_SHA}" \
              -m "Scheduler-Pro-PR: #${PR_NUMBER}" \
              -m "Scheduler-Pro-Bump: ${bump}"
            git push origin HEAD:main
            release_sha="$(git rev-parse HEAD)"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and publish canonical GHCR images first
        id: images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${RELEASE_SHA:0:12}"
          gh workflow run images.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f image_tag="$TAG" \
            -f source_sha="$RELEASE_SHA"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow images.yml --event workflow_dispatch \
                --json databaseId,displayTitle,status,createdAt --limit 30 \
                --jq ".[] | select(.displayTitle | contains(\"Images ${TAG} / ${short_sha}\")) | .databaseId" \
                | head -n 1
            )"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Não foi possível localizar o workflow de imagens ${TAG}." >&2
            exit 10
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Create immutable canonical Git tag after image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            ref_sha="$(jq -r '.object.sha' <<< "$ref_json")"
            if [ "$ref_sha" != "$RELEASE_SHA" ]; then
              echo "Tag ${TAG} já existe em ${ref_sha}; esperado ${RELEASE_SHA}." >&2
              exit 11
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Publish GitHub Release only after GHCR succeeds
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --event workflow_dispatch \
                --json databaseId,status,createdAt --limit 10 --jq '.[0].databaseId // empty'
            )"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Não foi possível localizar o workflow Release ${TAG}." >&2
            exit 12
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Dispatch versioned distribution artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          correlation="canonical-pr-${PR_NUMBER}-${RELEASE_SHA:0:12}"
          gh workflow run distribution-artifacts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f artifact_suffix="$TAG" \
            -f correlation_id="$correlation"

      - name: Canonical publication summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          IMAGES_RUN: ${{ steps.images.outputs.run_id }}
          RELEASE_RUN: ${{ steps.release.outputs.run_id }}
        run: |
          echo "Canonical version: ${TAG}"
          echo "SemVer bump:       ${BUMP}"
          echo "Release commit:    ${RELEASE_SHA}"
          echo "Images run:        ${IMAGES_RUN}"
          echo "Release run:       ${RELEASE_RUN}"
