name: Canonical Merge Release
run-name: Canonical PR #${{ github.event.pull_request.number }} / ${{ github.event.pull_request.merge_commit_sha }}

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write
  actions: write

concurrency:
  group: canonical-release-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

jobs:
  publish-canonical:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve canonical merge and next alpha tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            echo "Merge SHA ausente; recusando publicação canônica." >&2
            exit 1
          fi

          existing_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.target_commitish == \"${MERGE_SHA}\") | .tag_name" \
              | head -n 1
          )"

          if [ -n "$existing_tag" ]; then
            echo "O merge ${MERGE_SHA} já possui a release ${existing_tag}; nenhuma duplicata será criada."
            echo "tag=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max_alpha="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
              | sed -nE 's/^v0\.1\.0-alpha\.([0-9]+)$/\1/p' \
              | sort -n \
              | tail -n 1
          )"
          max_alpha="${max_alpha:-0}"
          next_alpha=$((max_alpha + 1))
          tag="v0.1.0-alpha.${next_alpha}"

          while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; do
            next_alpha=$((next_alpha + 1))
            tag="v0.1.0-alpha.${next_alpha}"
          done

          echo "Criando tag canônica ${tag} em ${MERGE_SHA} para a PR #${PR_NUMBER}."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${MERGE_SHA}" >/dev/null

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical release, images and distribution
        if: steps.version.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          correlation="canonical-pr-${PR_NUMBER}-${MERGE_SHA:0:12}"

          echo "Disparando Release para ${TAG} / ${MERGE_SHA}"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"

          echo "Disparando imagens GHCR canônicas para ${MERGE_SHA}"
          gh workflow run images.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f image_tag="latest"

          echo "Disparando pacote de distribuição canônico para ${TAG}"
          gh workflow run distribution-artifacts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f artifact_suffix="$TAG" \
            -f correlation_id="$correlation"

      - name: Canonical publication summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          ALREADY_PUBLISHED: ${{ steps.version.outputs.already_published }}
        run: |
          echo "Canonical merge: ${MERGE_SHA}"
          echo "Canonical tag:   ${TAG}"
          echo "Already exists:  ${ALREADY_PUBLISHED}"
