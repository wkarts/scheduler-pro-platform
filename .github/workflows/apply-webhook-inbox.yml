name: Apply reviewed webhook inbox
on:
  push:
    branches: [feat/tenant-iam-integracoes-busca]
    paths: [.github/workflows/apply-webhook-inbox.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-webhook-inbox
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wkarts/scheduler-pro-platform' && github.ref == 'refs/heads/feat/tenant-iam-integracoes-busca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact source and reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma, subprocess
          parent = subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()
          assert parent == '2aff4876053a877d12a26b247a44514192c0e310', 'Unexpected branch source'
          parts = sorted(Path('.github/inbox-transfer').glob('*.xzpart'))
          assert len(parts) == 6
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '819ccce014fd7fea50525dc04ffd9dcdb46bda8bfbb7f588380d9f2e05a353bc'
          assert b'diff --git a/.github/workflows/' not in patch
          target = '/tmp/reviewed-webhook.patch'
          Path(target).write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',target], check=True)
          subprocess.run(['git','apply','--index',target], check=True)
          PY
      - name: Publish source only to existing PR99 branch
        run: |
          git rm -r .github/inbox-transfer
          git diff --cached --check
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: permite tokens sem expiração e webhooks de entrada isolados'
          git push origin HEAD:refs/heads/feat/tenant-iam-integracoes-busca
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
