name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        working-directory: apps/api
        run: python -m compileall app tests
      - name: Ruff
        working-directory: apps/api
        run: ruff check app tests
      - name: Mypy backend
        working-directory: apps/api
        shell: bash
        run: |
          set +e
          mypy app --show-error-codes --no-color-output | tee /tmp/mypy-output.txt
          status=${PIPESTATUS[0]}
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^([^:]+):(\d+)(?::(\d+))?: error: (.*)$")
          for raw in Path("/tmp/mypy-output.txt").read_text(encoding="utf-8").splitlines():
              match = pattern.match(raw)
              if not match:
                  continue
              path, line, column, message = match.groups()
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              location = f"file={path},line={line}"
              if column:
                  location += f",col={column}"
              print(f"::error {location}::{message}")
          PY
          exit "$status"
      - name: Operation script boundary regressions
        run: python -m unittest discover -s scripts/tests -p test_operations.py -v
      - name: Unit tests
        working-directory: apps/api
        run: pytest -q -m "not integration"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Session resilience runtime regressions
        run: node --test scripts/tests/auth-fetch.test.cjs
      - name: Validate PWA installation contract
        run: node scripts/build/validate-pwa-install.mjs
      - name: Typecheck/build PWA and mobile surfaces
        run: |
          npm run typecheck
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CloudPanel and ARGWS Compose models
        env:
          APP_SECRET_KEY: ci-only-secret-key-with-more-than-sixty-four-characters-00000000000000000000
          PLATFORM_ADMIN_EMAIL: ci-admin@example.com
          PLATFORM_ADMIN_PASSWORD: ci-admin-password-2026
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_ADMIN_PASSWORD: ci-postgres-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          S3_ACCESS_KEY: scheduler
          S3_SECRET_KEY: ci-minio-secret-key
          CLOUDFLARE_API_TOKEN: ci-cloudflare-token
          ACME_EMAIL: ci-acme@example.com
        run: |
          docker compose -f deployments/cloudpanel/compose.yaml config --quiet
          docker compose -f deployments/cloudpanel/compose.argws.yaml config --quiet
      - name: Validate embedded ACME and CloudPanel agent entrypoints
        shell: bash
        run: |
          sh -n infrastructure/docker/acme/entrypoint.sh
          bash -n infrastructure/docker/cloudpanel-agent/entrypoint.sh
      - name: Docker build API fallback image
        run: docker build -t scheduler-pro-api:ci .
      - name: Docker build web image
        run: docker build -f infrastructure/docker/web/Dockerfile --build-arg APP_DIR=apps/web -t scheduler-pro-web:ci .
      - name: Docker build admin image
        run: docker build -f infrastructure/docker/web/Dockerfile --build-arg APP_DIR=apps/admin -t scheduler-pro-admin:ci .
      - name: Docker build proxy image
        run: docker build -f infrastructure/docker/proxy/Dockerfile -t scheduler-pro-proxy:ci .
      - name: Docker build ACME image
        run: docker build -f infrastructure/docker/acme/Dockerfile -t scheduler-pro-acme:ci .
      - name: Docker build CloudPanel agent image
        run: docker build -f infrastructure/docker/cloudpanel-agent/Dockerfile -t scheduler-pro-cloudpanel-agent:ci .
