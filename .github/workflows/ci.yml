name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        working-directory: apps/api
        run: python -m compileall app tests
      - name: Ruff
        working-directory: apps/api
        run: ruff check app tests
      - name: Mypy backend
        working-directory: apps/api
        shell: bash
        run: |
          set +e
          mypy app --show-error-codes --no-color-output | tee /tmp/mypy-output.txt
          status=${PIPESTATUS[0]}
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^([^:]+):(\d+)(?::(\d+))?: error: (.*)$")
          for raw in Path("/tmp/mypy-output.txt").read_text(encoding="utf-8").splitlines():
              match = pattern.match(raw)
              if not match:
                  continue
              path, line, column, message = match.groups()
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              location = f"file={path},line={line}"
              if column:
                  location += f",col={column}"
              print(f"::error {location}::{message}")
          PY
          exit "$status"
      - name: Unit tests
        working-directory: apps/api
        run: pytest -q -m "not integration"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Validate Windows Tauri MSI version contract
        run: node scripts/build/prepare-windows-tauri-version.mjs --self-test
      - name: Typecheck/build
        run: |
          npm run typecheck --workspaces --if-present
          npm run build --workspaces --if-present

  windows-desktop-bundle:
    name: Windows MSI + NSIS / ${{ matrix.app_name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app_path: apps/desktop, app_name: client }
          - { app_path: apps/admin-desktop, app_name: admin }
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS deps
        run: npm install
      - name: Generate canonical Tauri icon set
        shell: bash
        run: npx tauri icon packages/branding/scheduler-pro/brand-symbol.svg --output ${{ matrix.app_path }}/src-tauri/icons
      - name: Normalize MSI-compatible Windows version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build/normalize-tauri-windows-version.mjs \
            "${{ matrix.app_path }}" \
            "src-tauri/tauri.conf.json" \
            "v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
      - name: Build Windows MSI and NSIS
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri:build -- --bundles msi,nsis
      - name: Require both Windows installers
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ matrix.app_path }}/src-tauri/target/release/bundle"
          msi="$(find "$bundle" -type f -name '*.msi' -print -quit)"
          nsis="$(find "$bundle" -type f \( -iname '*setup*.exe' -o -iname '*installer*.exe' \) -print -quit)"
          if [ -z "$msi" ]; then
            echo 'MSI não foi gerado.' >&2
            find "$bundle" -maxdepth 4 -type f -print || true
            exit 1
          fi
          if [ -z "$nsis" ]; then
            echo 'Instalador NSIS não foi gerado.' >&2
            find "$bundle" -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "MSI:  $msi"
          echo "NSIS: $nsis"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CloudPanel and ARGWS Compose models
        env:
          APP_SECRET_KEY: ci-only-secret-key-with-more-than-sixty-four-characters-00000000000000000000
          PLATFORM_ADMIN_EMAIL: ci-admin@example.com
          PLATFORM_ADMIN_PASSWORD: ci-admin-password-2026
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_ADMIN_PASSWORD: ci-postgres-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          S3_ACCESS_KEY: scheduler
          S3_SECRET_KEY: ci-minio-secret-key
          CLOUDFLARE_API_TOKEN: ci-cloudflare-token
          ACME_EMAIL: ci-acme@example.com
        run: |
          docker compose -f deployments/cloudpanel/compose.yaml config --quiet
          docker compose -f deployments/cloudpanel/compose.argws.yaml config --quiet
      - name: Validate embedded ACME and CloudPanel agent entrypoints
        shell: bash
        run: |
          sh -n infrastructure/docker/acme/entrypoint.sh
          bash -n infrastructure/docker/cloudpanel-agent/entrypoint.sh
      - name: Docker build API fallback image
        run: docker build -t scheduler-pro-api:ci .
      - name: Docker build web image
        run: docker build -f infrastructure/docker/web/Dockerfile --build-arg APP_DIR=apps/web -t scheduler-pro-web:ci .
      - name: Docker build admin image
        run: docker build -f infrastructure/docker/web/Dockerfile --build-arg APP_DIR=apps/admin -t scheduler-pro-admin:ci .
      - name: Docker build proxy image
        run: docker build -f infrastructure/docker/proxy/Dockerfile -t scheduler-pro-proxy:ci .
      - name: Docker build ACME image
        run: docker build -f infrastructure/docker/acme/Dockerfile -t scheduler-pro-acme:ci .
      - name: Docker build CloudPanel agent image
        run: docker build -f infrastructure/docker/cloudpanel-agent/Dockerfile -t scheduler-pro-cloudpanel-agent:ci .
