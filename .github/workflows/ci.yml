name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**', 'feat/**', 'fix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        working-directory: apps/api
        run: python -m compileall app tests
      - name: Ruff
        working-directory: apps/api
        run: ruff check app tests
      - name: Mypy backend
        working-directory: apps/api
        run: mypy app
      - name: Unit tests
        working-directory: apps/api
        run: pytest -q -m "not integration"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Typecheck/build
        run: |
          npm run typecheck --workspaces --if-present
          npm run build --workspaces --if-present

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build API fallback image
        run: docker build -t scheduler-pro-api:ci .
      - name: Docker build web image
        run: docker build -f infrastructure/docker/web/Dockerfile --build-arg APP_DIR=apps/web -t scheduler-pro-web:ci .
      - name: Docker build admin image
        run: docker build -f infrastructure/docker/web/Dockerfile --build-arg APP_DIR=apps/admin -t scheduler-pro-admin:ci .
      - name: Docker build proxy image
        run: docker build -f infrastructure/docker/proxy/Dockerfile -t scheduler-pro-proxy:ci .
