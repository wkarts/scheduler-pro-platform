name: Fix residual white-label placeholder

on:
  push:
    branches:
      - feat/incremental-security-booking-whatsapp-20260826

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incremental-security-booking-whatsapp-20260826
      - name: Replace visible technical placeholder
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/admin/src/AdminControlPlane.vue')
          text = path.read_text(encoding='utf-8')
          old = 'placeholder="cloudflare, evolution..."'
          new = 'placeholder="domínios, comunicação, armazenamento..."'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/src/AdminControlPlane.vue
          git commit -m 'fix: remove placeholder técnico residual do admin'
          git push origin HEAD:feat/incremental-security-booking-whatsapp-20260826
