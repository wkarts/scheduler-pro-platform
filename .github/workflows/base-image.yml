name: Base Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infrastructure/docker/base/python/Dockerfile'
      - 'apps/api/requirements.txt'
      - '.github/workflows/base-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  python-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/base/python/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/python-base:3.13
            ghcr.io/${{ github.repository }}/python-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
