name: Distribution Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: 'Sufixo dos artefatos'
        required: false
        default: 'manual'

permissions:
  contents: read
  actions: read

env:
  ARTIFACT_SUFFIX: ${{ github.event.inputs.artifact_suffix || github.sha }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install
      - name: Build web/admin/desktop/mobile shells
        run: |
          npm --workspace apps/web run build
          npm --workspace apps/admin run build
          npm --workspace apps/desktop run build
          npm --workspace apps/mobile run build
      - name: Pack artifacts
        run: |
          mkdir -p artifacts/deploy artifacts/apps
          tar -C apps/web/dist -czf artifacts/apps/scheduler-pro-web-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C apps/admin/dist -czf artifacts/apps/scheduler-pro-admin-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C apps/desktop/dist -czf artifacts/apps/scheduler-pro-desktop-shell-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C apps/mobile/dist -czf artifacts/apps/scheduler-pro-mobile-shell-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C deployments/cloudpanel -czf artifacts/deploy/scheduler-pro-cloudpanel-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C deployments/dockge -czf artifacts/deploy/scheduler-pro-dockge-${ARTIFACT_SUFFIX}.tar.gz .
          cat > artifacts/distribution-manifest.json <<JSON
          {
            "product": "Scheduler Pro",
            "source_sha": "${GITHUB_SHA}",
            "source_ref": "${GITHUB_REF_NAME}",
            "artifacts": [
              "scheduler-pro-web-${ARTIFACT_SUFFIX}.tar.gz",
              "scheduler-pro-admin-${ARTIFACT_SUFFIX}.tar.gz",
              "scheduler-pro-desktop-shell-${ARTIFACT_SUFFIX}.tar.gz",
              "scheduler-pro-mobile-shell-${ARTIFACT_SUFFIX}.tar.gz",
              "scheduler-pro-cloudpanel-${ARTIFACT_SUFFIX}.tar.gz",
              "scheduler-pro-dockge-${ARTIFACT_SUFFIX}.tar.gz"
            ]
          }
          JSON
          sha256sum artifacts/apps/*.tar.gz artifacts/deploy/*.tar.gz > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-distribution-${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/**
          retention-days: 30
