name: Distribution Artifacts
run-name: Distribution ${{ inputs.correlation_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: 'Versão/sufixo dos artefatos'
        required: false
        default: 'manual'
      correlation_id:
        description: 'Correlação do Build Manager'
        required: false
        default: ''

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ARTIFACT_SUFFIX: ${{ github.event.inputs.artifact_suffix || github.sha }}

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install workspaces
        run: npm install
      - name: Build canonical web and dedicated mobile frontends
        run: |
          npm --workspace apps/web run build
          npm --workspace apps/admin run build
          npm --workspace apps/mobile run build
          npm --workspace apps/admin-mobile run build
      - name: Pack versioned artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/deploy artifacts/apps
          tar -C apps/web/dist -czf artifacts/apps/scheduler-pro-web-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C apps/admin/dist -czf artifacts/apps/scheduler-pro-admin-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C apps/mobile/dist -czf artifacts/apps/scheduler-pro-mobile-client-ui-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C apps/admin-mobile/dist -czf artifacts/apps/scheduler-pro-mobile-admin-ui-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C deployments/cloudpanel -czf artifacts/deploy/scheduler-pro-cloudpanel-${ARTIFACT_SUFFIX}.tar.gz .
          tar -C deployments/dockge -czf artifacts/deploy/scheduler-pro-dockge-${ARTIFACT_SUFFIX}.tar.gz .
          cat > artifacts/distribution-manifest.json <<JSON
          {
            "product": "Scheduler Pro",
            "version_or_suffix": "${ARTIFACT_SUFFIX}",
            "source_sha": "${GITHUB_SHA}",
            "delivery_strategy": "pwa-first",
            "web_architecture": "installable-pwa",
            "mobile_architecture": "dedicated-api-client-ui",
            "native_artifact_generation": "paused",
            "native_targets_paused": ["android", "ios"],
            "desktop_installers": null
          }
          JSON
          sha256sum artifacts/apps/*.tar.gz artifacts/deploy/*.tar.gz > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-distribution-${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/**
          retention-days: 30
