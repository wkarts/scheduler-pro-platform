name: Mobile Artifacts
run-name: Mobile ${{ inputs.correlation_id || github.sha }}

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**','apps/admin-mobile/**','scripts/build/ensure-tauri-icons.mjs','package.json','package-lock.json','.github/workflows/mobile-artifacts.yml']
  workflow_dispatch:
    inputs:
      build_profile: { description: 'Build profile id or slug', required: false, default: 'default' }
      target: { description: 'android|ios|admin-android|admin-ios|all', required: false, default: 'all' }
      correlation_id: { description: 'Correlação do Build Manager', required: false, default: '' }
  release:
    types: [published]

permissions: { contents: write, actions: write }

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || contains(inputs.target, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app_path: apps/mobile, app_name: client }
          - { app_path: apps/admin-mobile, app_name: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=${sdk_root}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm install
      - name: Validate dedicated UI
        run: npm --workspace ${{ matrix.app_path }} run build
      - run: node scripts/build/ensure-tauri-icons.mjs ${{ matrix.app_path }}/src-tauri/icons
      - name: Initialize Android
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: if [ ! -d src-tauri/gen/android ]; then npm run tauri:android:init; fi
      - name: Build debug installable arm64 APK
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri:android:apk:debug
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ github.event.release.tag_name || github.sha }}"; mkdir -p artifacts
          apk="$(find '${{ matrix.app_path }}/src-tauri' -type f -name '*debug*.apk' -print -quit)"; test -n "$apk"
          cp "$apk" "artifacts/scheduler-pro-${{ matrix.app_name }}-android-${suffix}-debug-installable.apk"
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: 'scheduler-pro-${{ matrix.app_name }}-android-debug-installable-${{ github.event.release.tag_name || github.sha }}', path: 'artifacts/*', if-no-files-found: error, retention-days: 30 }
      - name: Attach to release
        if: github.event_name == 'release'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || contains(inputs.target, 'ios')
    runs-on: macos-15
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app_path: apps/mobile, app_name: client }
          - { app_path: apps/admin-mobile, app_name: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim' }
      - run: npm install
      - name: Validate dedicated UI
        run: npm --workspace ${{ matrix.app_path }} run build
      - run: node scripts/build/ensure-tauri-icons.mjs ${{ matrix.app_path }}/src-tauri/icons
      - name: Initialize iOS
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: if [ ! -d src-tauri/gen/apple ]; then npm run tauri:ios:init || true; fi
      - name: Build iOS app
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: npm run tauri:ios:build || true
      - name: Package IPA or status
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ github.event.release.tag_name || github.sha }}"; mkdir -p artifacts
          ipa="$(find '${{ matrix.app_path }}/src-tauri' -type f -name '*.ipa' -print -quit || true)"
          app="$(find '${{ matrix.app_path }}/src-tauri' -type d -name '*.app' -print -quit || true)"
          if [ -n "$ipa" ]; then cp "$ipa" "artifacts/scheduler-pro-${{ matrix.app_name }}-ios-${suffix}-unsigned.ipa";
          elif [ -n "$app" ]; then rm -rf Payload; mkdir Payload; cp -R "$app" Payload/; /usr/bin/zip -qry "artifacts/scheduler-pro-${{ matrix.app_name }}-ios-${suffix}-unsigned.ipa" Payload;
          else printf '%s\n' 'Nenhum .app/.ipa foi gerado.' 'Instalação em aparelho físico exige assinatura Apple/ad-hoc.' > "artifacts/scheduler-pro-${{ matrix.app_name }}-ios-${suffix}-STATUS.txt"; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'scheduler-pro-${{ matrix.app_name }}-ios-${{ github.event.release.tag_name || github.sha }}', path: 'artifacts/*', if-no-files-found: error, retention-days: 30 }
      - name: Attach to release
        if: github.event_name == 'release'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber
