name: Mobile Artifacts

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile id or slug'
        required: false
        default: 'default'
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  mobile-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS deps
        run: npm install
      - name: Build mobile shell
        run: npm --workspace apps/mobile run build
      - name: Pack mobile shell artifact
        run: |
          mkdir -p artifacts
          tar -C apps/mobile/dist -czf artifacts/scheduler-pro-mobile-shell-${{ github.sha }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-mobile-shell-${{ github.sha }}
          path: artifacts/*

  android-unsigned:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install JS deps
        run: npm install
      - name: Build Android unsigned when native project exists
        working-directory: apps/mobile
        run: |
          if [ -d src-tauri/gen/android ]; then npm run tauri:android -- --release; else echo 'Android native project not initialized yet'; fi
      - name: Collect Android artifacts
        run: |
          mkdir -p artifacts
          find apps/mobile/src-tauri -name '*.apk' -o -name '*.aab' | xargs -r -I{} cp {} artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-android-unsigned-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: ignore
