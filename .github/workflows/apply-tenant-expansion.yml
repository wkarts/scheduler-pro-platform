name: Apply reviewed tenant expansion
on:
  push:
    branches: [feat/tenant-iam-integracoes-busca]
    paths: [.github/workflows/apply-tenant-expansion.yml]
permissions:
  contents: write
concurrency:
  group: apply-tenant-expansion
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wkarts/scheduler-pro-platform' && github.ref == 'refs/heads/feat/tenant-iam-integracoes-busca'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify reviewed source and exact baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma, subprocess
          base = subprocess.check_output(['git','show','-s','--format=%P','HEAD'], text=True).strip()
          assert base == 'dc3c0cb6ba41af71246927a771fccb556c5d3a86', 'Unexpected baseline'
          parts = sorted(Path('.github/iam-transfer').glob('*.xzpart'))
          assert len(parts) == 6
          data = b''.join(p.read_bytes() for p in parts)
          assert len(data) == 41392
          patch = lzma.decompress(data)
          assert len(patch) == 196321
          assert hashlib.sha256(patch).hexdigest() == 'a41fb0bc40ffef206ffbb39b885dc490b45feb39e2196f9e8cda69585f9283de'
          assert b'diff --git a/.github/workflows/' not in patch
          target = '/tmp/tenant-expansion.patch'
          Path(target).write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--check','--index',target],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index',target],check=True)
          PY
      - name: Publish complete source only to the new feature branch
        run: |
          git rm -r .github/iam-transfer
          git diff --cached --check
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integra usuários, grupos, perfis, view de integrações e busca livre'
          git push origin HEAD:refs/heads/feat/tenant-iam-integracoes-busca
          echo "Complete source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
