name: PR59 temporary head fix
on:
  push:
    branches:
      - feat/agenda-business-model-reports-global-templates-20260826
    paths:
      - .github/workflows/_tmp-pr59-fix-head.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agenda-business-model-reports-global-templates-20260826
      - name: Update platform migration head in foundation integration
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/PLATFORM_MIGRATION_HEAD = "platform_0010_admin_2fa"/PLATFORM_MIGRATION_HEAD = "platform_0011_global_templates"/' apps/api/tests/test_foundation_integration.py
          grep -n 'PLATFORM_MIGRATION_HEAD' apps/api/tests/test_foundation_integration.py | head
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_foundation_integration.py
          git commit -m 'test(migrations): atualizar head global templates'
          git push origin HEAD:feat/agenda-business-model-reports-global-templates-20260826
