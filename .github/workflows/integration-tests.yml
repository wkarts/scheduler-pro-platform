name: Integration Tests

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'deployments/development/**'
      - '.env.example'
      - 'Dockerfile'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'apps/api/**'
      - 'deployments/development/**'
      - '.env.example'
      - 'Dockerfile'
      - '.github/workflows/integration-tests.yml'

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-multitenant-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose -f deployments/development/docker-compose.yml config --quiet
      - name: Start development stack and bootstrap
        run: docker compose -f deployments/development/docker-compose.yml up --build -d
      - name: Wait for real readiness
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/api/v1/health/ready >/tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f deployments/development/docker-compose.yml ps
          docker compose -f deployments/development/docker-compose.yml logs --no-color
          exit 1
      - name: Integration tests against PostgreSQL Redis RabbitMQ and MinIO
        shell: bash
        run: |
          docker compose -f deployments/development/docker-compose.yml exec -T api \
            pytest -vv --tb=short -m integration --junitxml=/tmp/foundation-integration.xml
      - name: Copy integration diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p .ci-diagnostics
          docker compose -f deployments/development/docker-compose.yml cp \
            api:/tmp/foundation-integration.xml .ci-diagnostics/foundation-integration.xml || true
          docker compose -f deployments/development/docker-compose.yml ps \
            > .ci-diagnostics/compose-ps.txt 2>&1 || true
          docker compose -f deployments/development/docker-compose.yml logs --no-color bootstrap api \
            > .ci-diagnostics/compose-bootstrap-api.log 2>&1 || true
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-integration-diagnostics
          path: .ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Migration downgrade and re-upgrade
        shell: bash
        run: |
          docker compose -f deployments/development/docker-compose.yml exec -T api \
            alembic -c alembic-tenant.ini downgrade tenant_0001
          docker compose -f deployments/development/docker-compose.yml exec -T api \
            alembic -c alembic-tenant.ini upgrade head
          docker compose -f deployments/development/docker-compose.yml exec -T api \
            alembic -c alembic.ini downgrade platform_0003
          docker compose -f deployments/development/docker-compose.yml exec -T api \
            alembic -c alembic.ini upgrade head
          docker compose -f deployments/development/docker-compose.yml run --rm bootstrap
      - name: Smoke test after migration roundtrip
        run: |
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/api/v1/health/live
          curl -fsS -H 'Host: localhost' http://127.0.0.1:8000/api/v1/health/ready
      - name: Stack diagnostics
        if: always()
        run: |
          docker compose -f deployments/development/docker-compose.yml ps
          docker compose -f deployments/development/docker-compose.yml logs --no-color bootstrap api || true
      - name: Clean stack
        if: always()
        run: docker compose -f deployments/development/docker-compose.yml down -v --remove-orphans
