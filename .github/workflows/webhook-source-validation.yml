name: Webhook source validation
on:
  push:
    branches: [feat/tenant-iam-integracoes-busca]
    paths: [.github/workflows/webhook-source-validation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source without credentials
        run: |
          git archive --format=tar.gz HEAD -o /tmp/scheduler-webhook-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-webhook-source
          path: /tmp/scheduler-webhook-source.tar.gz
          retention-days: 1
