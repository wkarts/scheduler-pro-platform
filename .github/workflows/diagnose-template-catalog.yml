name: Diagnose Template Catalog

on:
  push:
    branches:
      - feat/avb-2-3-complete-pages-pwa-navigation
    paths:
      - '.github/workflows/diagnose-template-catalog.yml'
      - 'apps/api/resources/template-catalog/v1/release-b64/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official template catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, tarfile
          from io import BytesIO
          import re

          root = Path('apps/api/resources/template-catalog/v1/release-b64')
          rx = re.compile(r'^part-(\d{3})\.b64$')
          parts = []
          for p in root.glob('part-*.b64'):
              m = rx.fullmatch(p.name)
              if m:
                  parts.append((int(m.group(1)), p))
          parts.sort()
          encoded = ''.join(p.read_text(encoding='ascii').strip() for _, p in parts)
          rem = len(encoded) % 4
          padded = encoded + '=' * ((4-rem) % 4)
          release = base64.b64decode(padded, validate=True)
          print('parts=', [n for n,_ in parts])
          print('encoded_length=', len(encoded), 'remainder=', rem)
          print('release_length=', len(release))
          print('release_sha256=', hashlib.sha256(release).hexdigest())
          try:
              with tarfile.open(fileobj=BytesIO(release), mode='r:gz') as tf:
                  names = tf.getnames()
                  print('tar_valid=true')
                  print('member_count=', len(names))
                  print('members=', names)
                  if 'catalog.json' in names:
                      c = json.load(tf.extractfile('catalog.json'))
                      print('catalog=', json.dumps(c, ensure_ascii=False, sort_keys=True))
          except Exception as exc:
              print('tar_valid=false')
              print(type(exc).__name__, str(exc))
              raise
          PY
