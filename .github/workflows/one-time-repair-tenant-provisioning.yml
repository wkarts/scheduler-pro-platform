name: One-time repair tenant provisioning

on:
  push:
    branches:
      - fix/complete-runtime-artifacts-cloudflare
    paths:
      - .github/workflows/one-time-repair-tenant-provisioning.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-runtime-artifacts-cloudflare
          fetch-depth: 0

      - name: Repair tenant provisioning runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"expected block not found in {path}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/api/app/services/provisioning_runtime.py",
              '''            try:\n                await self._run_step(name, tenant)\n            except Exception as exc:  # noqa: BLE001 - persisted for ops diagnostics\n                step.status = ProvisioningStepStatus.failed.value\n                step.error = str(exc)[:4000]\n                job.status = "FAILED"\n                tenant.status = TenantStatus.failed.value\n                await self.session.execute(\n                    text("update provisioning_jobs set updated_at=now() where id=cast(:id as uuid)"),\n                    {"id": job_id},\n                )\n                await self.logs.record_platform_log(\n                    tenant_id=str(tenant.id),\n                    source="provisioning",\n                    service="provisioning-runtime",\n                    level="ERROR",\n                    event="provisioning_step_failed",\n                    message=f"Falha no passo {name}.",\n                    correlation_id=job.correlation_id,\n                    error_code="PROVISIONING_STEP_FAILED",\n                    details={"step": name, "error": str(exc)},\n                )\n                await self.session.commit()\n                return\n''',
              '''            tenant_id = str(tenant.id)\n            step_id = str(step.id)\n            correlation_id = job.correlation_id\n            try:\n                await self._run_step(name, tenant)\n            except Exception as exc:  # noqa: BLE001 - persisted for ops diagnostics\n                error_message = str(exc)[:4000]\n                # Qualquer erro PostgreSQL pode deixar a transação SQLAlchemy abortada.\n                # O rollback precisa ocorrer antes de persistir FAILED; sem isso o job\n                # permanece eternamente RUNNING/PROVISIONING.\n                await self.session.rollback()\n                failed_step = await self.session.get(ProvisioningStep, step_id)\n                failed_job = await self.session.get(ProvisioningJob, job_id)\n                failed_tenant = await self.session.get(Tenant, tenant_id)\n                if failed_step is not None:\n                    failed_step.status = ProvisioningStepStatus.failed.value\n                    failed_step.error = error_message\n                if failed_job is not None:\n                    failed_job.status = "FAILED"\n                if failed_tenant is not None:\n                    failed_tenant.status = TenantStatus.failed.value\n                await self.session.execute(\n                    text("update provisioning_jobs set updated_at=now() where id=cast(:id as uuid)"),\n                    {"id": job_id},\n                )\n                await self.logs.record_platform_log(\n                    tenant_id=tenant_id,\n                    source="provisioning",\n                    service="provisioning-runtime",\n                    level="ERROR",\n                    event="provisioning_step_failed",\n                    message=f"Falha no passo {name}.",\n                    correlation_id=correlation_id,\n                    error_code="PROVISIONING_STEP_FAILED",\n                    details={"step": name, "error": error_message},\n                )\n                await self.session.commit()\n                return\n''',
          )

          replace_once(
              "apps/api/app/services/provisioning_runtime.py",
              """                    'welcome_email_status', :status,\n                    'welcome_email_recipient', :recipient,\n""",
              """                    'welcome_email_status', cast(:status as text),\n                    'welcome_email_recipient', cast(:recipient as text),\n""",
          )

          replace_once(
              "apps/api/app/db/postgres_admin.py",
              '''    candidates = [\n        AdminCredentialAttempt(\n            "POSTGRES_ADMIN_*",\n            (settings.postgres_admin_user or "").strip(),\n            settings.postgres_admin_password or "",\n        ),\n        AdminCredentialAttempt(\n            "POSTGRES_*",\n            (settings.postgres_user or "").strip(),\n            settings.postgres_password or "",\n        ),\n    ]\n''',
              '''    # Na imagem oficial postgres, POSTGRES_USER criado no primeiro initdb\n    # é o superusuário real do cluster. Tente-o primeiro para não gerar um FATAL\n    # artificial em stacks onde o papel `postgres` não existe.\n    candidates = [\n        AdminCredentialAttempt(\n            "POSTGRES_*",\n            (settings.postgres_user or "").strip(),\n            settings.postgres_password or "",\n        ),\n        AdminCredentialAttempt(\n            "POSTGRES_ADMIN_*",\n            (settings.postgres_admin_user or "").strip(),\n            settings.postgres_admin_password or "",\n        ),\n    ]\n''',
          )

          replace_once(
              "apps/api/app/api/v1/routes/platform.py",
              '''    await session.execute(\n        text("update provisioning_jobs set status='PENDING' where id=cast(:id as uuid)"),\n        {"id": job_id},\n    )\n    await session.execute(\n        text(\n            """\n            update provisioning_steps\n            set status='pending', error=null\n            where job_id=cast(:id as uuid) and status='failed'\n            """\n        ),\n        {"id": job_id},\n    )\n''',
              '''    await session.execute(\n        text(\n            "update provisioning_jobs set status='PENDING', updated_at=now() "\n            "where id=cast(:id as uuid)"\n        ),\n        {"id": job_id},\n    )\n    await session.execute(\n        text(\n            """\n            update provisioning_steps\n            set status='pending', error=null\n            where job_id=cast(:id as uuid) and status <> 'completed'\n            """\n        ),\n        {"id": job_id},\n    )\n''',
          )

          replace_once(
              "apps/admin/src/AdminControlPlane.vue",
              """<button v-if=\"hasPermission('tenants.provision') && job.status === 'FAILED'\" class=\"btn small\" @click=\"retryProvision(job.id)\">Tentar novamente</button>""",
              """<button v-if=\"hasPermission('tenants.provision') && ['FAILED','PROVISIONING'].includes(job.status)\" class=\"btn small\" @click=\"retryProvision(job.id)\">{{ job.status === 'PROVISIONING' ? 'Reprocessar' : 'Tentar novamente' }}</button>""",
          )

          replace_once(
              "apps/api/tests/test_postgres_admin_resilience.py",
              '''async def test_admin_connection_falls_back_when_postgres_password_is_wrong(monkeypatch) -> None:\n    monkeypatch.setattr(settings, "postgres_admin_user", "postgres")\n    monkeypatch.setattr(settings, "postgres_admin_password", "wrong-admin-password")\n    monkeypatch.setattr(settings, "postgres_user", "scheduler")\n    monkeypatch.setattr(settings, "postgres_password", "platform-password")\n\n    platform_conn = FakeAdminConnection(privileged=True)\n    attempted_users: list[str] = []\n\n    async def fake_connect(**kwargs: Any) -> Any:\n        user = str(kwargs["user"])\n        attempted_users.append(user)\n        if user == "postgres":\n            raise asyncpg.InvalidPasswordError("password authentication failed")\n        return platform_conn\n\n    monkeypatch.setattr(postgres_admin.asyncpg, "connect", fake_connect)\n\n    conn = await postgres_admin.connect_postgres_admin()\n\n    assert conn is platform_conn\n    assert attempted_users == ["postgres", "scheduler"]\n    assert platform_conn.closed is False\n''',
              '''async def test_admin_connection_prefers_postgres_user_created_by_official_image(monkeypatch) -> None:\n    monkeypatch.setattr(settings, "postgres_admin_user", "postgres")\n    monkeypatch.setattr(settings, "postgres_admin_password", "wrong-admin-password")\n    monkeypatch.setattr(settings, "postgres_user", "scheduler")\n    monkeypatch.setattr(settings, "postgres_password", "platform-password")\n\n    platform_conn = FakeAdminConnection(privileged=True)\n    attempted_users: list[str] = []\n\n    async def fake_connect(**kwargs: Any) -> Any:\n        user = str(kwargs["user"])\n        attempted_users.append(user)\n        if user == "postgres":\n            raise asyncpg.InvalidPasswordError("password authentication failed")\n        return platform_conn\n\n    monkeypatch.setattr(postgres_admin.asyncpg, "connect", fake_connect)\n\n    conn = await postgres_admin.connect_postgres_admin()\n\n    assert conn is platform_conn\n    assert attempted_users == ["scheduler"]\n    assert platform_conn.closed is False\n''',
          )

          replace_once(
              "apps/api/tests/test_postgres_admin_resilience.py",
              '''    limited_conn = FakeAdminConnection(privileged=False)\n    platform_conn = FakeAdminConnection(privileged=True)\n\n    async def fake_connect(**kwargs: Any) -> Any:\n        if kwargs["user"] == "postgres":\n            return limited_conn\n        return platform_conn\n\n    monkeypatch.setattr(postgres_admin.asyncpg, "connect", fake_connect)\n\n    conn = await postgres_admin.connect_postgres_admin()\n\n    assert conn is platform_conn\n    assert limited_conn.closed is True\n    assert platform_conn.closed is False\n''',
              '''    platform_conn = FakeAdminConnection(privileged=False)\n    admin_conn = FakeAdminConnection(privileged=True)\n\n    async def fake_connect(**kwargs: Any) -> Any:\n        if kwargs["user"] == "scheduler":\n            return platform_conn\n        return admin_conn\n\n    monkeypatch.setattr(postgres_admin.asyncpg, "connect", fake_connect)\n\n    conn = await postgres_admin.connect_postgres_admin()\n\n    assert conn is admin_conn\n    assert platform_conn.closed is True\n    assert admin_conn.closed is False\n''',
          )

          Path("apps/api/tests/test_provisioning_stuck_job_regression.py").write_text(
              '''from pathlib import Path\n\n\ndef test_welcome_email_json_parameters_have_explicit_postgres_types() -> None:\n    source = Path(__file__).parents[1] / "app" / "services" / "provisioning_runtime.py"\n    text = source.read_text(encoding="utf-8")\n    assert "'welcome_email_status', cast(:status as text)" in text\n    assert "'welcome_email_recipient', cast(:recipient as text)" in text\n\n\ndef test_runtime_rolls_back_before_persisting_failed_step() -> None:\n    source = Path(__file__).parents[1] / "app" / "services" / "provisioning_runtime.py"\n    text = source.read_text(encoding="utf-8")\n    rollback = text.index("await self.session.rollback()", text.index("except Exception as exc"))\n    failed = text.index("failed_step.status = ProvisioningStepStatus.failed.value", rollback)\n    assert rollback < failed\n\n\ndef test_retry_recovers_running_as_well_as_failed_steps() -> None:\n    source = Path(__file__).parents[1] / "app" / "api" / "v1" / "routes" / "platform.py"\n    text = source.read_text(encoding="utf-8")\n    assert "status <> 'completed'" in text\n''',
              encoding="utf-8",
          )
          PY

      - name: Commit repaired runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/services/provisioning_runtime.py \
                  apps/api/app/db/postgres_admin.py \
                  apps/api/app/api/v1/routes/platform.py \
                  apps/admin/src/AdminControlPlane.vue \
                  apps/api/tests/test_postgres_admin_resilience.py \
                  apps/api/tests/test_provisioning_stuck_job_regression.py
          git rm .github/workflows/one-time-repair-tenant-provisioning.yml
          git commit -m "fix: recuperar provisionamento de tenant travado"
          git push origin HEAD:fix/complete-runtime-artifacts-cloudflare
