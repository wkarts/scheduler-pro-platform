name: Apply reviewed tenant IAM source
on:
  push:
    branches: [feat/tenant-users-groups-profiles]
    paths: [.github/workflows/apply-reviewed-tenant-iam.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-tenant-iam
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'wkarts/scheduler-pro-platform' && github.ref == 'refs/heads/feat/tenant-users-groups-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma, subprocess
          parts = sorted(Path('.github/tenant-iam-transfer').glob('*.xzpart'))
          assert len(parts) == 5, 'Incomplete reviewed transfer'
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '779b35ad2f603b418dbf282b0602e43822a025f17136cbad853aab589e58f21c'
          assert b'diff --git a/.github/workflows/' not in patch
          Path('/tmp/tenant-iam.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '/tmp/tenant-iam.patch'], check=True)
          subprocess.run(['git', 'apply', '--whitespace=fix', '--index', '/tmp/tenant-iam.patch'], check=True)
          PY
      - name: Validate backend and operation regressions
        run: |
          python -m pip install -r apps/api/requirements.txt
          cd apps/api
          python -m compileall -q app tests
          ruff check app tests
          mypy app --show-error-codes --no-color-output
          pytest -q -m 'not integration'
          cd ../..
          python -m unittest discover -s scripts/tests -p test_operations.py -v
      - name: Persist validated source on feature branch
        run: |
          git rm -r .github/tenant-iam-transfer
          git diff --cached --check
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: expande usuários e perfis por tenant e ajusta navegação e busca'
          git push origin HEAD:refs/heads/feat/tenant-users-groups-profiles
          echo "Validated source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git archive --format=tar.gz HEAD -o /tmp/tenant-iam-reviewed-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tenant-iam-reviewed-source
          path: /tmp/tenant-iam-reviewed-source.tar.gz
          retention-days: 1
