name: Hotfix Evolution UI compatibility

on:
  push:
    branches:
      - hotfix/restore-evolution-whatsapp-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/restore-evolution-whatsapp-20260826
      - name: Restore legacy WhatsApp contract in UI
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('apps/web/src/TenantConfigurationCenter.vue')
          text = config.read_text(encoding='utf-8')
          old_type = '''type WhatsStatus = {
  product:string
  status:{code:string;label:string}
  connection_method?:string|null
  phone?:string|null
  last_activity?:string|null
  qr_code?:{image?:string|null;refresh_available?:boolean}|null
  pairing_code?:string|null
}'''
          new_type = '''type WhatsStatus = {
  product?:string
  instance_name?:string
  status:string
  connection_method?:string|null
  phone?:string|null
  qr?:{base64?:string|null;pairing_code?:string|null;code?:string|null;count?:number|null}|null
  pairing_code?:string|null
  provider?:Record<string,unknown>
}'''
          if old_type not in text:
              raise SystemExit('WhatsStatus contract block not found')
          text = text.replace(old_type, new_type)
          marker = '''function failure(error:unknown, fallback:string):void {
  errorMessage.value=error instanceof Error ? error.message : fallback
}
'''
          helper = '''function failure(error:unknown, fallback:string):void {
  errorMessage.value=error instanceof Error ? error.message : fallback
}
function whatsStatusLabel(status?:string|null):string {
  const labels:Record<string,string>={
    DISCONNECTED:'Desconectado', CONNECTING:'Conectando', CONNECTED:'Conectado',
    RECONNECTING:'Reconectando', FAILED:'Falha',
  }
  return labels[String(status || '').toUpperCase()] || 'Desconhecido'
}
'''
          if marker not in text:
              raise SystemExit('failure helper marker not found')
          text = text.replace(marker, helper)
          text = text.replace("ARGWS WhatsApp API", "ARGWS Whatsapp API")
          text = text.replace("{{ whats?.status?.label || 'Desconhecido' }}", "{{ whatsStatusLabel(whats?.status) }}")
          text = text.replace("whats?.qr_code?.image", "whats?.qr?.base64")
          text = text.replace("whats.qr_code.image", "whats.qr?.base64")
          config.write_text(text, encoding='utf-8')

          console = Path('apps/web/src/TenantConsole.vue')
          text = console.read_text(encoding='utf-8')
          text = text.replace("{ key: 'whatsapp', label: 'WhatsApp API', icon: MessageCircle, capability: 'whatsapp' },", "{ key: 'whatsapp', label: 'ARGWS Whatsapp API', icon: MessageCircle, capability: 'whatsapp' },")
          text = text.replace('ARGWS WhatsApp API', 'ARGWS Whatsapp API')
          console.write_text(text, encoding='utf-8')
          PY
      - name: Commit hotfix UI
        run: |
          git rm .github/workflows/hotfix-evolution-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/TenantConfigurationCenter.vue apps/web/src/TenantConsole.vue
          git commit -m 'hotfix: restaura contrato visual do WhatsApp legado'
          git push origin HEAD:hotfix/restore-evolution-whatsapp-20260826
