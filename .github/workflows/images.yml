name: Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Versão SemVer do conjunto completo de imagens GHCR. Vazio usa VERSION.'
        required: false
        default: ''

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolver versão canônica
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve e valida SemVer
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.image_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_TAG#v}"
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão GHCR inválida: ${version}. Esperado MAJOR.MINOR.PATCH." >&2
            exit 2
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Versão canônica das imagens: ${version}"

  base:
    name: Build base imutável
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da base pelo SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/base/python/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/python-base:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  services:
    name: Build ${{ matrix.name }} imutável
    needs: [version, base]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infrastructure/docker/api/Dockerfile
            tag: api
            build_args: "PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository }}/python-base:${{ github.sha }}"
          - name: worker
            file: infrastructure/docker/worker/Dockerfile
            tag: worker
            build_args: "PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository }}/python-base:${{ github.sha }}"
          - name: web
            file: infrastructure/docker/web/Dockerfile
            tag: web
            build_args: "APP_DIR=apps/web"
          - name: admin
            file: infrastructure/docker/web/Dockerfile
            tag: admin
            build_args: "APP_DIR=apps/admin"
          - name: proxy
            file: infrastructure/docker/proxy/Dockerfile
            tag: proxy
            build_args: ""
          - name: acme
            file: infrastructure/docker/acme/Dockerfile
            tag: acme
            build_args: ""
          - name: cloudpanel-agent
            file: infrastructure/docker/cloudpanel-agent/Dockerfile
            tag: cloudpanel-agent
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push de ${{ matrix.name }} pelo SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            ${{ matrix.build_args }}
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_RELEASE_TAG=${{ needs.version.outputs.version }}
            APP_BUILD_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY_PREFIX }}/${{ matrix.tag }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Promover conjunto validado para SemVer e latest
    needs: [version, base, services]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validar todos os manifests imutáveis antes da promoção
        shell: bash
        run: |
          set -euo pipefail
          for image in python-base api worker web admin proxy acme cloudpanel-agent; do
            docker buildx imagetools inspect "${REGISTRY_PREFIX}/${image}:${GITHUB_SHA}" >/dev/null
          done
      - name: Publicar versão imutável e atualizar latest atomicamente por conjunto
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão GHCR inválida: ${RELEASE_VERSION}" >&2
            exit 2
          fi

          # Primeiro publica todas as tags SemVer. Somente depois que o conjunto
          # versionado inteiro existe, move latest para o mesmo SHA.
          for image in python-base api worker web admin proxy acme cloudpanel-agent; do
            source_ref="${REGISTRY_PREFIX}/${image}:${GITHUB_SHA}"
            version_ref="${REGISTRY_PREFIX}/${image}:${RELEASE_VERSION}"
            docker buildx imagetools create --tag "${version_ref}" "${source_ref}"
            docker buildx imagetools inspect "${version_ref}" >/dev/null
          done

          for image in python-base api worker web admin proxy acme cloudpanel-agent; do
            source_ref="${REGISTRY_PREFIX}/${image}:${GITHUB_SHA}"
            latest_ref="${REGISTRY_PREFIX}/${image}:latest"
            docker buildx imagetools create --tag "${latest_ref}" "${source_ref}"
            docker buildx imagetools inspect "${latest_ref}" >/dev/null
          done

          {
            echo "## Conjunto de imagens promovido"
            echo
            echo "Versão: \`${RELEASE_VERSION}\`"
            echo "Alias: \`latest\`"
            echo "SHA imutável: \`${GITHUB_SHA}\`"
            echo
            echo "Cada imagem possui as referências \`${RELEASE_VERSION}\`, \`latest\` e \`${GITHUB_SHA}\`."
            echo "A tag latest somente foi movida depois que o conjunto SemVer completo foi validado."
          } >> "${GITHUB_STEP_SUMMARY}"
