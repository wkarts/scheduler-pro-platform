name: Images
run-name: Images ${{ inputs.image_tag || 'VERSION' }} / ${{ inputs.source_sha && format('{0}', inputs.source_sha) || github.sha }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Versão SemVer do conjunto completo de imagens GHCR. Vazio usa VERSION.'
        required: false
        default: ''
      source_sha:
        description: 'Commit exato a construir. Vazio usa o SHA do workflow.'
        required: false
        default: ''

concurrency:
  group: images-${{ inputs.image_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolver versão canônica
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      minor_tag: ${{ steps.resolve.outputs.minor_tag }}
      major_tag: ${{ steps.resolve.outputs.major_tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve e valida SemVer/SHA
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.image_tag || '' }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_TAG#v}"
          source_sha="${INPUT_SOURCE_SHA:-$GITHUB_SHA}"

          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão GHCR inválida: ${version}. Esperado MAJOR.MINOR.PATCH." >&2
            exit 2
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA de origem inválido: ${source_sha}" >&2
            exit 3
          fi

          git fetch origin "$source_sha" --depth=1 || true
          git cat-file -e "${source_sha}^{commit}"
          IFS='.' read -r major minor patch <<< "$version"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor_tag=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "major_tag=${major}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

  base:
    name: Build base multiarch imutável
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da base pelo SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/base/python/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/python-base:${{ needs.version.outputs.source_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  services:
    name: Build ${{ matrix.name }} multiarch imutável
    needs: [version, base]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infrastructure/docker/api/Dockerfile
            tag: api
            build_args: "PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository }}/python-base:${{ needs.version.outputs.source_sha }}"
          - name: worker
            file: infrastructure/docker/worker/Dockerfile
            tag: worker
            build_args: "PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository }}/python-base:${{ needs.version.outputs.source_sha }}"
          - name: web
            file: infrastructure/docker/web/Dockerfile
            tag: web
            build_args: "APP_DIR=apps/web"
          - name: admin
            file: infrastructure/docker/web/Dockerfile
            tag: admin
            build_args: "APP_DIR=apps/admin"
          - name: proxy
            file: infrastructure/docker/proxy/Dockerfile
            tag: proxy
            build_args: ""
          - name: acme
            file: infrastructure/docker/acme/Dockerfile
            tag: acme
            build_args: ""
          - name: cloudpanel-agent
            file: infrastructure/docker/cloudpanel-agent/Dockerfile
            tag: cloudpanel-agent
            build_args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push de ${{ matrix.name }} pelo SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ${{ matrix.build_args }}
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_RELEASE_TAG=${{ needs.version.outputs.version }}
            APP_BUILD_SHA=${{ needs.version.outputs.source_sha }}
          tags: ${{ env.REGISTRY_PREFIX }}/${{ matrix.tag }}:${{ needs.version.outputs.source_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Promover conjunto validado para SemVer aliases e latest
    needs: [version, base, services]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validar todos os manifests multiarch antes da promoção
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          for image in python-base api worker web admin proxy acme cloudpanel-agent; do
            ref="${REGISTRY_PREFIX}/${image}:${SOURCE_SHA}"
            docker buildx imagetools inspect "$ref" >/tmp/inspect.txt
            grep -q 'linux/amd64' /tmp/inspect.txt
            grep -q 'linux/arm64' /tmp/inspect.txt
          done
      - name: Publicar version, minor, major e latest somente após conjunto completo
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          MINOR_TAG: ${{ needs.version.outputs.minor_tag }}
          MAJOR_TAG: ${{ needs.version.outputs.major_tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
        run: |
          set -euo pipefail

          for image in python-base api worker web admin proxy acme cloudpanel-agent; do
            source_ref="${REGISTRY_PREFIX}/${image}:${SOURCE_SHA}"
            version_ref="${REGISTRY_PREFIX}/${image}:${RELEASE_VERSION}"
            docker buildx imagetools create --tag "$version_ref" "$source_ref"
            docker buildx imagetools inspect "$version_ref" >/dev/null
          done

          # Aliases MAJOR.MINOR e MAJOR só avançam depois que TODAS as tags completas existem.
          for alias in "$MINOR_TAG" "$MAJOR_TAG"; do
            for image in python-base api worker web admin proxy acme cloudpanel-agent; do
              source_ref="${REGISTRY_PREFIX}/${image}:${SOURCE_SHA}"
              target_ref="${REGISTRY_PREFIX}/${image}:${alias}"
              docker buildx imagetools create --tag "$target_ref" "$source_ref"
              docker buildx imagetools inspect "$target_ref" >/dev/null
            done
          done

          # latest permanece explícito para compatibilidade com contratos e deploys existentes.
          for image in python-base api worker web admin proxy acme cloudpanel-agent; do
            source_ref="${REGISTRY_PREFIX}/${image}:${SOURCE_SHA}"
            latest_ref="${REGISTRY_PREFIX}/${image}:latest"
            docker buildx imagetools create --tag "$latest_ref" "$source_ref"
            docker buildx imagetools inspect "$latest_ref" >/dev/null
          done

          {
            echo "## Conjunto de imagens promovido"
            echo
            echo "SemVer: \`${RELEASE_VERSION}\`"
            echo "Minor: \`${MINOR_TAG}\`"
            echo "Major: \`${MAJOR_TAG}\`"
            echo "Latest: \`latest\`"
            echo "SHA: \`${SOURCE_SHA}\`"
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
