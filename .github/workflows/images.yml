name: Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag das imagens GHCR'
        required: false
        default: 'latest'
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest' }}

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/base/python/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/python-base:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}/python-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  services:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infrastructure/docker/api/Dockerfile
            tag: api
            build_args: "PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository }}/python-base:${{ env.IMAGE_TAG }}"
          - name: worker
            file: infrastructure/docker/worker/Dockerfile
            tag: worker
            build_args: "PYTHON_BASE_IMAGE=ghcr.io/${{ github.repository }}/python-base:${{ env.IMAGE_TAG }}"
          - name: web
            file: infrastructure/docker/web/Dockerfile
            tag: web
            build_args: "APP_DIR=apps/web"
          - name: admin
            file: infrastructure/docker/web/Dockerfile
            tag: admin
            build_args: "APP_DIR=apps/admin"
          - name: proxy
            file: infrastructure/docker/proxy/Dockerfile
            tag: proxy
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
