name: Desktop Artifacts

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile id or slug'
        required: false
        default: 'default'
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps
        run: npm install
      - name: Build desktop frontend
        run: npm --workspace apps/desktop run build
      - name: Build Tauri unsigned
        working-directory: apps/desktop
        run: npm run tauri:build
      - name: Pack desktop target
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf artifacts/scheduler-pro-desktop-${{ matrix.label }}-${{ github.event.release.tag_name || github.sha }}.tar.gz -C apps/desktop/src-tauri/target . || true
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-desktop-${{ matrix.label }}-${{ github.event.release.tag_name || github.sha }}
          path: artifacts/*
          if-no-files-found: error
      - name: Attach desktop artifact to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber
