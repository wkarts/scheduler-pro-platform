name: Desktop Artifacts

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-artifacts.yml'
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile id or slug'
        required: false
        default: 'default'
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps
        run: npm install
      - name: Ensure Tauri icons
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/icons
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const table = new Uint32Array(256);
          for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            table[n] = c >>> 0;
          }
          function crc32(buf) {
            let c = 0xffffffff;
            for (const b of buf) c = table[(c ^ b) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const t = Buffer.from(type);
            const len = Buffer.alloc(4);
            len.writeUInt32BE(data.length);
            const crc = Buffer.alloc(4);
            crc.writeUInt32BE(crc32(Buffer.concat([t, data])));
            return Buffer.concat([len, t, data, crc]);
          }
          function makePng(w, h) {
            const rows = [];
            for (let y = 0; y < h; y++) {
              const row = Buffer.alloc(1 + w * 4);
              row[0] = 0;
              for (let x = 0; x < w; x++) {
                const i = 1 + x * 4;
                const grad = Math.round(48 + 80 * (x / w));
                row[i] = 20;
                row[i + 1] = grad;
                row[i + 2] = 220;
                row[i + 3] = 255;
                const s1 = x > w * 0.28 && x < w * 0.72 && y > h * 0.23 && y < h * 0.34;
                const s2 = x > w * 0.28 && x < w * 0.72 && y > h * 0.45 && y < h * 0.56;
                const s3 = x > w * 0.28 && x < w * 0.72 && y > h * 0.67 && y < h * 0.78;
                const s4 = x > w * 0.28 && x < w * 0.40 && y > h * 0.23 && y < h * 0.56;
                const s5 = x > w * 0.60 && x < w * 0.72 && y > h * 0.45 && y < h * 0.78;
                if (s1 || s2 || s3 || s4 || s5) {
                  row[i] = 255;
                  row[i + 1] = 255;
                  row[i + 2] = 255;
                }
              }
              rows.push(row);
            }
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(w, 0);
            ihdr.writeUInt32BE(h, 4);
            ihdr[8] = 8;
            ihdr[9] = 6;
            ihdr[10] = 0;
            ihdr[11] = 0;
            ihdr[12] = 0;
            return Buffer.concat([
              Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
              chunk('IHDR', ihdr),
              chunk('IDAT', zlib.deflateSync(Buffer.concat(rows))),
              chunk('IEND', Buffer.alloc(0)),
            ]);
          }
          const png256 = makePng(256, 256);
          fs.writeFileSync('src-tauri/icons/icon.png', png256);
          const header = Buffer.alloc(6);
          header.writeUInt16LE(0, 0);
          header.writeUInt16LE(1, 2);
          header.writeUInt16LE(1, 4);
          const entry = Buffer.alloc(16);
          entry[0] = 0;
          entry[1] = 0;
          entry[2] = 0;
          entry[3] = 0;
          entry.writeUInt16LE(1, 4);
          entry.writeUInt16LE(32, 6);
          entry.writeUInt32LE(png256.length, 8);
          entry.writeUInt32LE(header.length + entry.length, 12);
          fs.writeFileSync('src-tauri/icons/icon.ico', Buffer.concat([header, entry, png256]));
          NODE
          test -s src-tauri/icons/icon.png
          test -s src-tauri/icons/icon.ico
      - name: Typecheck desktop frontend
        run: npm --workspace apps/desktop run typecheck
      - name: Build Tauri desktop unsigned
        working-directory: apps/desktop
        run: npm run tauri:build
      - name: Collect desktop binaries
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ github.event.release.tag_name || github.sha }}"
          mkdir -p artifacts/stage
          if [ -d apps/desktop/src-tauri/target/release/bundle ]; then
            cp -R apps/desktop/src-tauri/target/release/bundle artifacts/stage/bundle
          fi
          find apps/desktop/src-tauri/target/release -maxdepth 1 -type f \( -perm -111 -o -name '*.exe' \) -print -exec cp {} artifacts/stage/ \; || true
          if [ ! -d artifacts/stage/bundle ] && [ -z "$(find artifacts/stage -type f -print -quit)" ]; then
            echo 'Nenhum binário desktop foi gerado.' >&2
            exit 1
          fi
          tar -czf "artifacts/scheduler-pro-desktop-${{ matrix.label }}-${suffix}.tar.gz" -C artifacts/stage .
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-desktop-${{ matrix.label }}-${{ github.event.release.tag_name || github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Attach desktop artifact to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber
