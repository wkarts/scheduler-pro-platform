name: Desktop Artifacts
run-name: Desktop ${{ inputs.correlation_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      distribution_slug:
        description: 'Identificador da distribuição/tenant usado no nome do artefato'
        required: false
        default: 'platform'
      client_web_url:
        description: 'URL HTTPS da distribuição; /api/v1 será usado pelo Desktop cliente'
        required: false
        default: 'https://scheduler.argws.com.br'
      admin_web_url:
        description: 'URL HTTPS do Control Plane; /api/v1 será usado pelo Desktop administrativo'
        required: false
        default: 'https://admin.scheduler.argws.com.br'
      client_product_name:
        description: 'Nome visível do Desktop cliente'
        required: false
        default: 'Scheduler Pro'
      correlation_id:
        description: 'Correlação do Build Manager'
        required: false
        default: ''

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.distribution_slug || 'platform' }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  tauri-desktop:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux, app_path: apps/desktop, app_name: client, bundles: deb }
          - { os: windows-latest, label: windows, app_path: apps/desktop, app_name: client, bundles: 'msi,nsis' }
          - { os: macos-15, label: macos, app_path: apps/desktop, app_name: client, bundles: dmg }
          - { os: ubuntu-24.04, label: linux, app_path: apps/admin-desktop, app_name: admin, bundles: deb }
          - { os: windows-latest, label: windows, app_path: apps/admin-desktop, app_name: admin, bundles: 'msi,nsis' }
          - { os: macos-15, label: macos, app_path: apps/admin-desktop, app_name: admin, bundles: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps
        run: npm install
      - name: Generate canonical Tauri icon set
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: npx tauri icon ../../packages/branding/scheduler-pro/brand-symbol.svg --output src-tauri/icons
      - name: Configure local desktop bundle and API endpoint
        shell: bash
        env:
          INPUT_SLUG: ${{ inputs.distribution_slug || 'platform' }}
          INPUT_CLIENT_URL: ${{ inputs.client_web_url || 'https://scheduler.argws.com.br' }}
          INPUT_ADMIN_URL: ${{ inputs.admin_web_url || 'https://admin.scheduler.argws.com.br' }}
          INPUT_CLIENT_NAME: ${{ inputs.client_product_name || 'Scheduler Pro' }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$INPUT_SLUG" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')"; slug="${slug:-platform}"
          if [ "${{ matrix.app_name }}" = "client" ]; then
            api_url="$INPUT_CLIENT_URL"; product_name="$INPUT_CLIENT_NAME"
            if [ "$slug" = "platform" ]; then identifier="br.com.argws.schedulerpro"; else identifier="br.com.argws.schedulerpro.$(printf '%s' "$slug" | tr -d '-')"; fi
          else
            api_url="$INPUT_ADMIN_URL"; product_name="Scheduler Pro Admin"; identifier="br.com.argws.schedulerpro.admin"
          fi
          node scripts/build/configure-desktop-webview.mjs "${{ matrix.app_path }}" "$api_url" "$product_name" "$identifier"
          node scripts/build/validate-desktop-local.mjs "${{ matrix.app_path }}"
          echo "DISTRIBUTION_SLUG=$slug" >> "$GITHUB_ENV"
      - name: Build installable desktop with bundled Vue UI
        working-directory: ${{ matrix.app_path }}
        run: npm run tauri:build -- --config src-tauri/tauri.generated.conf.json --bundles ${{ matrix.bundles }}
      - name: Collect installers only
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ github.sha }}"
          mkdir -p artifacts/installers artifacts/output
          find "${{ matrix.app_path }}/src-tauri/target/release/bundle" -type f \( -name '*.msi' -o -name '*setup*.exe' -o -name '*Setup*.exe' -o -name '*.dmg' -o -name '*.deb' \) -print0 | while IFS= read -r -d '' file; do cp "$file" artifacts/installers/; done
          if [ -z "$(find artifacts/installers -type f -print -quit)" ]; then echo 'Nenhum instalador final foi gerado.' >&2; exit 1; fi
          tar -C artifacts/installers -czf "artifacts/output/scheduler-pro-${{ matrix.app_name }}-desktop-${{ matrix.label }}-${DISTRIBUTION_SLUG}-${suffix}.tar.gz" .
          (cd artifacts/output && sha256sum * > "scheduler-pro-${{ matrix.app_name }}-desktop-${{ matrix.label }}-${DISTRIBUTION_SLUG}-${suffix}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-${{ matrix.app_name }}-desktop-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/output/*
          if-no-files-found: error
          retention-days: 1


  aggregate:
    name: Desktop package / all supported systems
    needs: tauri-desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scheduler-pro-*-desktop-*-${{ github.sha }}
          path: collected
          merge-multiple: true
      - name: Create one delivery package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find collected -type f -print -quit)"
          mkdir -p final
          find collected -type f -maxdepth 2 -print | LC_ALL=C sort > final/CONTENTS.txt
          tar -C collected -czf "final/scheduler-pro-desktop-complete-${{ github.sha }}.tar.gz" .
          (cd final && sha256sum scheduler-pro-desktop-complete-*.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-desktop-complete-${{ github.sha }}
          path: final/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
