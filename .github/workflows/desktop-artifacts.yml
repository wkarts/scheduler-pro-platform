name: Desktop Artifacts

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-artifacts.yml'
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile id or slug'
        required: false
        default: 'default'
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps
        run: npm install
      - name: Typecheck desktop frontend
        run: npm --workspace apps/desktop run typecheck
      - name: Build Tauri desktop unsigned
        working-directory: apps/desktop
        run: npm run tauri:build
      - name: Collect desktop binaries
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ github.event.release.tag_name || github.sha }}"
          mkdir -p artifacts/stage
          if [ -d apps/desktop/src-tauri/target/release/bundle ]; then
            cp -R apps/desktop/src-tauri/target/release/bundle artifacts/stage/bundle
          fi
          find apps/desktop/src-tauri/target/release -maxdepth 1 -type f \( -perm -111 -o -name '*.exe' \) -print -exec cp {} artifacts/stage/ \; || true
          if [ ! -d artifacts/stage/bundle ] && [ -z "$(find artifacts/stage -type f -print -quit)" ]; then
            echo 'Nenhum binário desktop foi gerado.' >&2
            exit 1
          fi
          tar -czf "artifacts/scheduler-pro-desktop-${{ matrix.label }}-${suffix}.tar.gz" -C artifacts/stage .
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-pro-desktop-${{ matrix.label }}-${{ github.event.release.tag_name || github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Attach desktop artifact to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber
