name: Mobile Apps Check

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/admin-mobile/**'
      - 'packages/branding/scheduler-pro/**'
      - 'scripts/mobile/**'
      - 'scripts/release/package-ios-unsigned.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-apps-check.yml'
      - '.github/workflows/mobile-artifacts.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install JS deps
        run: npm install
      - name: Typecheck and build client mobile UI
        run: |
          npm --workspace apps/mobile run typecheck
          npm --workspace apps/mobile run build
      - name: Typecheck and build admin mobile UI
        run: |
          npm --workspace apps/admin-mobile run typecheck
          npm --workspace apps/admin-mobile run build
