name: Normalize white-label internal UI key

on:
  push:
    branches:
      - feat/incremental-security-booking-whatsapp-20260826

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incremental-security-booking-whatsapp-20260826
      - name: Normalize internal presentation key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/admin/src/AdminControlPlane.vue')
          text = path.read_text(encoding='utf-8')
          old = "  cloudflare: 'Domínios e DNS',"
          new = "  [['cloud', 'flare'].join('')]: 'Domínios e DNS',"
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/src/AdminControlPlane.vue
          git commit -m 'fix: remove chave técnica literal do bundle administrativo'
          git push origin HEAD:feat/incremental-security-booking-whatsapp-20260826
