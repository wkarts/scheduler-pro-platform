name: One-time sync migration contract

on:
  push:
    branches:
      - fix/complete-runtime-artifacts-cloudflare
    paths:
      - '.github/workflows/one-time-sync-migration-test.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-runtime-artifacts-cloudflare
          fetch-depth: 0
      - name: Synchronize integration migration head and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/tests/test_foundation_integration.py')
          source = path.read_text(encoding='utf-8')
          old = 'PLATFORM_MIGRATION_HEAD = "platform_0006"'
          new = 'PLATFORM_MIGRATION_HEAD = "platform_0007"'
          if old not in source:
              raise SystemExit('Contrato antigo platform_0006 não encontrado; abortando sem alteração cega.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/one-time-sync-migration-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_foundation_integration.py
          git commit -m 'test: sincronizar migration head da integração'
          git push origin HEAD:fix/complete-runtime-artifacts-cloudflare
