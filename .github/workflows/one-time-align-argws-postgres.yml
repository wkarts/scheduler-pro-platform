name: One-time align ARGWS PostgreSQL admin

on:
  push:
    branches:
      - fix/complete-runtime-artifacts-cloudflare
    paths:
      - .github/workflows/one-time-align-argws-postgres.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-runtime-artifacts-cloudflare
          fetch-depth: 0
      - name: Align PostgreSQL admin defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('deployments/cloudpanel/compose.argws.yaml')
          text = path.read_text(encoding='utf-8')
          old = '''  POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}\n  POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD obrigatória}\n'''
          new = '''  # POSTGRES_USER é o superusuário criado pelo initdb desta stack.\n  POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-scheduler}\n  POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}}\n'''
          if old not in text:
              raise SystemExit('expected postgres admin block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit compose alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/cloudpanel/compose.argws.yaml
          git rm .github/workflows/one-time-align-argws-postgres.yml
          git commit -m "fix: usar superusuário real no compose ARGWS"
          git push origin HEAD:fix/complete-runtime-artifacts-cloudflare
