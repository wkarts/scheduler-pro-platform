name: Integration validation snapshot
on:
  push:
    branches: [feat/api-webhook-services-amd64]
    paths: [.github/workflows/integration-validation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package tracked source and validation wheels (no credentials)
        run: |
          mkdir -p /tmp/scheduler-validation/wheels
          git archive --format=tar.gz HEAD -o /tmp/scheduler-validation/source.tar.gz
          python -m pip wheel -r apps/api/requirements.txt --wheel-dir /tmp/scheduler-validation/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-validation-snapshot
          path: /tmp/scheduler-validation
          retention-days: 1
