upstream scheduler_api {
  server scheduler-api:8000;
}

upstream scheduler_web {
  server scheduler-web:80;
}

upstream scheduler_admin {
  server scheduler-admin:80;
}

server {
  listen 80;
  server_name admin.*;

  location ~ (^|/)\. {
    return 404;
  }

  location ^~ /api/ {
    client_max_body_size 100m;
    proxy_pass http://scheduler_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://scheduler_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80 default_server;
  server_name _;

  location ~ (^|/)\. {
    return 404;
  }

  location ^~ /api/ {
    client_max_body_size 100m;
    proxy_pass http://scheduler_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Página pública curta de confirmação/cancelamento. O mesmo Host do tenant é
  # preservado para que o TenantResolver selecione o banco correto.
  location ^~ /a/ {
    client_max_body_size 1m;
    proxy_pass http://scheduler_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /integrations/whatsapp/webhook/ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_pass http://scheduler_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /admin/ {
    rewrite ^/admin/?(.*)$ /$1 break;
    proxy_pass http://scheduler_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://scheduler_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
