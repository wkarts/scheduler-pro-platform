<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B132B" />
    <link rel="icon" href="/branding/symbol.svg" type="image/svg+xml" />
    <title>Scheduler PRO Admin Mobile</title>
    <style>html,body,#app{margin:0;min-height:100%;background:#fff}body{font-family:Inter,Segoe UI,Arial,sans-serif}#brand-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(17,138,245,.12),transparent 30%),linear-gradient(160deg,#0F1E3A,#0B132B);transition:opacity .32s ease,visibility .32s ease}#brand-splash img{width:min(44vw,230px);height:auto;filter:drop-shadow(0 18px 44px rgba(0,0,0,.28))}#brand-splash.hide{opacity:0;visibility:hidden}</style>
  </head>
  <body>
    <div id="brand-splash"><img src="/branding/symbol.svg" alt="Scheduler PRO Admin" /></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>window.addEventListener('load',()=>setTimeout(()=>document.getElementById('brand-splash')?.classList.add('hide'),450))</script>
  </body>
</html>
