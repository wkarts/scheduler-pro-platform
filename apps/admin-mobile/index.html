<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081A33" />
    <link rel="icon" href="/branding/symbol.svg" type="image/svg+xml" />
    <title>Scheduler Pro Admin Mobile</title>
    <style>
      html,body,#app{margin:0;min-height:100%;background:#f4f7fb}body{font-family:Inter,Segoe UI,Arial,sans-serif}
      #brand-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:linear-gradient(160deg,#0b1d3a,#061327);transition:opacity .32s ease,visibility .32s ease}
      #brand-splash img{width:min(42vw,220px);height:auto;filter:drop-shadow(0 18px 44px rgba(0,0,0,.28))}
      #brand-splash.hide{opacity:0;visibility:hidden}
    </style>
  </head>
  <body>
    <div id="brand-splash"><img src="/branding/symbol.svg" alt="Scheduler Pro" /></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>window.addEventListener('load',()=>setTimeout(()=>document.getElementById('brand-splash')?.classList.add('hide'),450))</script>
  </body>
</html>
