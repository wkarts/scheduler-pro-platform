[package]
name = "scheduler_pro_admin_mobile"
version = "1.0.0"
description = "Scheduler Pro Admin Mobile"
authors = ["Wallace Kleiton <wkarts@gmail.com>"]
edition = "2021"

[lib]
name = "scheduler_pro_admin_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
mobile = ["tauri/wry", "tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mantém Android debug instalável/depurável pelo runtime Android, porém remove
# o debuginfo DWARF nativo do Rust que inflava o APK em centenas de MB.
[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false
opt-level = 1
