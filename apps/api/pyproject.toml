[project]
name = "scheduler-pro-api"
version = "0.1.0-alpha.1"
description = "Scheduler Pro FastAPI multitenant API"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL, Redis, RabbitMQ and MinIO development stack",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.services.cloudflare_service"
# A API Cloudflare é um payload JSON dinâmico (dict[str, Any]). O retorno real
# de _dns_record_matches é coberto por teste e normalizado como booleano em runtime.
disable_error_code = ["no-any-return"]
