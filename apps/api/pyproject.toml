[project]
name = "scheduler-pro-api"
version = "0.1.0-alpha.1"
description = "Scheduler Pro FastAPI multitenant API"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL, Redis, RabbitMQ and MinIO development stack",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
