<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#092449" />
    <title>Scheduler Pro Admin Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #eef3f9; color: #0f172a; }
      section { max-width: 520px; margin: 24px; padding: 32px; border-radius: 28px; background: white; box-shadow: 0 24px 60px rgba(15, 23, 42, .12); }
      .mark { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 18px; background: #2563eb; color: white; font-weight: 950; }
      h1 { margin: 24px 0 8px; font-size: 32px; }
      p { color: #64748b; line-height: 1.65; }
      button { margin-top: 18px; border: 0; border-radius: 14px; background: #2563eb; color: white; padding: 14px 18px; font-weight: 900; }
    </style>
  </head>
  <body>
    <section>
      <div class="mark">SP</div>
      <h1>Sem conexão com a plataforma</h1>
      <p>O painel administrativo está instalado, mas precisa de conexão para autenticar, consultar tenants, builds, domínios e auditoria.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </section>
  </body>
</html>
